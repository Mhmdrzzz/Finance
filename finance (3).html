<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دارایی من">
<title>دارایی من</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#fff;--bg1:#f5f5f3;--bg2:#ebebea;
--text1:#1a1a18;--text2:#555551;--text3:#888780;
--border:#e0dfd8;
--teal:#1D9E75;--teal-lt:#E1F5EE;--teal-dk:#085041;
--coral:#D85A30;--coral-lt:#FAECE7;
--blue:#378ADD;--blue-lt:#E6F1FB;--blue-dk:#0C447C;
--amber:#BA7517;--amber-lt:#FAEEDA;--amber-dk:#633806;
--purple:#534AB7;--purple-lt:#EEEDFE;--purple-dk:#26215C;
--red:#E24B4A;--red-lt:#FCEBEB;
--r-md:8px;--r-lg:12px;--r-xl:16px;
}
@media(prefers-color-scheme:dark){:root{
--bg0:#1c1c1a;--bg1:#232320;--bg2:#2a2a27;
--text1:#f0efe8;--text2:#b4b2a9;--text3:#888780;
--border:#38382f;
--teal:#5DCAA5;--teal-lt:#04342C;--teal-dk:#9FE1CB;
--coral:#F0997B;--coral-lt:#4A1B0C;
--blue:#85B7EB;--blue-lt:#042C53;--blue-dk:#B5D4F4;
--amber:#EF9F27;--amber-lt:#412402;--amber-dk:#FAC775;
--purple:#AFA9EC;--purple-lt:#26215C;--purple-dk:#CECBF6;
--red:#F09595;--red-lt:#501313;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--text1);font-size:15px;min-height:100vh;direction:rtl}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg0)}
.topbar{background:var(--bg0);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-size:17px;font-weight:500}
.topbar-sub{font-size:12px;color:var(--text3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding-bottom:90px}
.navbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg0);border-top:0.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;gap:3px}
.nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.nav-label{font-size:10px;color:var(--text3)}
.nav-item.active .nav-label{color:var(--teal);font-weight:500}
.section{padding:16px}
.card{background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{border-radius:var(--r-md);padding:12px;background:var(--bg1)}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.metric-value{font-size:20px;font-weight:500}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px}
.metric.teal{background:var(--teal-lt)}.metric.teal .metric-value{color:var(--teal-dk)}
.metric.coral{background:var(--coral-lt)}.metric.coral .metric-value{color:var(--coral)}
.metric.blue{background:var(--blue-lt)}.metric.blue .metric-value{color:var(--blue)}
.metric.purple{background:var(--purple-lt)}.metric.purple .metric-value{color:var(--purple)}
.hero{background:var(--teal-lt);border:0.5px solid var(--teal);border-radius:var(--r-xl);padding:20px;margin-bottom:12px;text-align:center}
.hero-label{font-size:12px;color:var(--teal-dk);margin-bottom:4px}
.hero-value{font-size:32px;font-weight:500;color:var(--teal-dk)}
.hero-sub{font-size:14px;color:var(--teal);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-md);border:0.5px solid var(--border);background:var(--bg0);color:var(--text1);font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-sm{padding:5px 12px;font-size:12px;width:auto;margin-bottom:0}
.btn-fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;background:var(--teal);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(29,158,117,.35);z-index:99}
.btn-fab:active{transform:scale(.94)}

/* price ticker strip */
.ticker{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;border-bottom:0.5px solid var(--border);scrollbar-width:none;background:var(--bg0)}
.ticker::-webkit-scrollbar{display:none}
.ticker-chip{flex-shrink:0;background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--r-md);padding:7px 12px;display:flex;flex-direction:column;gap:2px;min-width:80px}
.ticker-name{font-size:10px;color:var(--text3);font-weight:500}
.ticker-price{font-size:13px;font-weight:500;color:var(--text1)}
.ticker-change{font-size:10px}
.up{color:var(--teal)}.dn{color:var(--coral)}
.ticker-chip.loading .ticker-price{color:var(--text3)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.pulse{animation:blink 1s infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .7s linear infinite}

/* rate card */
.rate-card{background:var(--bg1);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.rate-card-icon{font-size:22px;flex-shrink:0}
.rate-card-info{flex:1}
.rate-card-name{font-size:12px;color:var(--text3)}
.rate-card-val{font-size:16px;font-weight:500;margin-top:2px}
.rate-card-src{font-size:10px;margin-top:2px}
.rate-card-src.live{color:var(--teal)}
.rate-card-src.manual{color:var(--amber)}
.rate-edit-btn{padding:5px 10px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg0);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;flex-shrink:0}

.tx-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px}
.tx-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text3);margin-top:2px}
.tx-amt{text-align:left;flex-shrink:0}
.tx-amt-main{font-size:15px;font-weight:500}
.tx-amt-sub{font-size:11px;color:var(--text3)}
.positive{color:var(--teal)}.negative{color:var(--coral)}
.sec-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:10px;letter-spacing:.3px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg0);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:500;margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text3);display:block;margin-bottom:5px}
.field input,.field select{width:100%;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text1);font-size:16px;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:-1px}
.seg{display:flex;background:var(--bg1);border-radius:var(--r-md);padding:3px;gap:2px;margin-bottom:14px}
.seg-opt{flex:1;padding:9px;text-align:center;border-radius:calc(var(--r-md) - 2px);font-size:13px;cursor:pointer;color:var(--text2)}
.seg-opt.active{background:var(--bg0);color:var(--text1);font-weight:500;border:0.5px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar-label{font-size:12px;color:var(--text2);width:72px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(--bg1);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:12px;color:var(--text2);width:60px;text-align:left;flex-shrink:0}
.acc-item{display:flex;align-items:center;justify-content:space-between;padding:13px;background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px}
.inv-item{display:flex;justify-content:space-between;align-items:center;padding:13px;background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px}
.badge{display:inline-block;padding:2px 7px;border-radius:var(--r-md);font-size:11px;font-weight:500;background:var(--blue-lt);color:var(--blue)}
.divider{border:none;border-top:0.5px solid var(--border);margin:4px 0}
.hint{background:var(--blue-lt);border:0.5px solid var(--blue);border-radius:var(--r-md);padding:13px;margin-bottom:12px;font-size:13px;color:var(--blue-dk);display:flex;align-items:flex-start;gap:10px;line-height:1.6}
.empty-state{text-align:center;padding:48px 24px;color:var(--text3)}
.day-label{font-size:11px;color:var(--text3);margin:12px 0 6px;font-weight:500}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="page-title">داشبورد</div>
      <div class="topbar-sub" id="page-sub"></div>
    </div>
    <button onclick="showPage('settings')" style="padding:6px 12px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit">تنظیمات</button>

      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="var(--text3)" stroke-width="1.5"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="var(--text3)" stroke-width="1.5"/></svg></div>

</div>
<div id="modal-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── storage ───────────────────────────────────────────────────
function db(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem('pf_'+k)||'null')}catch{return null}}try{localStorage.setItem('pf_'+k,JSON.stringify(v))}catch{}}

// ── constants ─────────────────────────────────────────────────
const CATS={
  expense:['خوراک','حمل‌ونقل','مسکن','سلامت','پوشاک','تفریح','آموزش','قبوض','سایر'],
  income:['حقوق','فریلنس','سود سرمایه','هدیه','سایر'],
  investment:['بیت‌کوین','اتریوم','PAXG','طلا','سهام','صندوق','ملک','سایر'],
};
const ICONS={خوراک:'🍽',حمل‌ونقل:'🚗',مسکن:'🏠',سلامت:'💊',پوشاک:'👕',تفریح:'🎮',آموزش:'📚',قبوض:'💡',حقوق:'💼',فریلنس:'💻','سود سرمایه':'📈',هدیه:'🎁','بیت‌کوین':'₿',اتریوم:'⟠',PAXG:'🥇',طلا:'🥇',سهام:'📊',صندوق:'🏦',ملک:'🏗',expense:'💸',income:'💰',investment:'📈',default:'💳'};
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

// Binance public ticker — no auth, no CORS issues
// GET https://api.binance.com/api/v3/ticker/24hr?symbols=[...]
const BINANCE_SYMBOLS = ['BTCUSDT','ETHUSDT','PAXGUSDT'];

// ── state ─────────────────────────────────────────────────────
let S={
  txs:       db('txs')         || [],
  accounts:  db('accounts')   || [
    {id:'a1',name:'کیف پول نقد',  type:'cash',       currency:'IRT', balance:50000000},
    {id:'a2',name:'بانک ملی',     type:'bank',       currency:'IRT', balance:200000000},
    {id:'a3',name:'حساب دلاری',   type:'bank',       currency:'USD', balance:500},
  ],
  investments: db('investments') || [
    {id:'i1',name:'بیت‌کوین', type:'بیت‌کوین', qty:0.05,  buyPrice:0, currency:'USD'},
    {id:'i2',name:'طلا مثقال',type:'طلا',       qty:3,     buyPrice:5000000, currency:'IRT'},
  ],
  // manual fiat rates (IRT = Toman)
  usdIRT: db('usdIRT') || 62000,
  eurIRT: db('eurIRT') || 68000,
  // live crypto prices in USD (from Binance)
  prices: db('prices') || {BTC:0, ETH:0, PAXG:0},
  priceAt: db('priceAt') || null,
  fetchingPrices: false,
  page:'dashboard',
  month: new Date().toISOString().slice(0,7),
  chart: null,
};

function save(){
  db('txs',S.txs); db('accounts',S.accounts); db('investments',S.investments);
  db('usdIRT',S.usdIRT); db('eurIRT',S.eurIRT);
  db('prices',S.prices); db('priceAt',S.priceAt);
}

// ── currency helpers ──────────────────────────────────────────
// Everything normalises to USD internally, display in both
function toUSD(amt,cur){
  if(cur==='USD'||cur==='USDT') return amt;
  if(cur==='EUR')  return amt * (S.usdIRT / Math.max(S.eurIRT,1));
  if(cur==='IRT')  return amt / Math.max(S.usdIRT,1);
  if(cur==='BTC')  return amt * Math.max(S.prices.BTC,1);
  if(cur==='ETH')  return amt * Math.max(S.prices.ETH,1);
  if(cur==='PAXG') return amt * Math.max(S.prices.PAXG,1);
  return amt / Math.max(S.usdIRT,1);
}
function toIRT(amt,cur){
  if(cur==='IRT')  return amt;
  if(cur==='EUR')  return amt * S.eurIRT;
  if(cur==='BTC')  return amt * S.prices.BTC * S.usdIRT;
  if(cur==='ETH')  return amt * S.prices.ETH * S.usdIRT;
  if(cur==='PAXG') return amt * S.prices.PAXG * S.usdIRT;
  return amt * S.usdIRT;   // USD / USDT
}
function fmtT(n){return Math.round(n).toLocaleString('fa-IR')}
function fmtU(n){return '$'+parseFloat(n).toFixed(2)}
function fmtUShort(n){
  if(n>=1000) return '$'+n.toLocaleString('en-US',{maximumFractionDigits:0});
  return '$'+parseFloat(n).toFixed(2);
}
function today(){return new Date().toISOString().split('T')[0]}
function ago(iso){
  if(!iso) return 'هرگز';
  const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);
  if(s<60) return 'همین الان';
  if(s<3600) return Math.floor(s/60)+' دقیقه پیش';
  if(s<86400) return Math.floor(s/3600)+' ساعت پیش';
  return Math.floor(s/86400)+' روز پیش';
}

// ── Binance price fetch ───────────────────────────────────────
async function fetchPrices(){
  if(S.fetchingPrices) return;
  S.fetchingPrices = true;
  updateTickerLoading(true);
  try{
    const url = 'https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","PAXGUSDT"]';
    const res = await Promise.race([
      fetch(url),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),8000))
    ]);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const map = {};
    data.forEach(d=>{ map[d.symbol] = {price: parseFloat(d.lastPrice), change: parseFloat(d.priceChangePercent)}; });
    if(map.BTCUSDT)  S.prices.BTC  = map.BTCUSDT.price;
    if(map.ETHUSDT)  S.prices.ETH  = map.ETHUSDT.price;
    if(map.PAXGUSDT) S.prices.PAXG = map.PAXGUSDT.price;
    S.priceAt = new Date().toISOString();
    save();
    updateTicker(map);
    // re-render financial pages so values update
    if(['dashboard','investments','accounts'].includes(S.page)) render();
  }catch(e){
    updateTickerError();
    console.warn('Binance fetch error:', e.message);
  }
  S.fetchingPrices = false;
}

// ── ticker UI ─────────────────────────────────────────────────
function updateTickerLoading(on){
  ['BTC','ETH','PAXG'].forEach(sym=>{
    const p=document.querySelector(`#chip-${sym} .ticker-price`);
    if(p&&on) p.classList.add('pulse');
  });
}
function updateTicker(map){
  const pairs = {BTC:'BTCUSDT',ETH:'ETHUSDT',PAXG:'PAXGUSDT'};
  Object.entries(pairs).forEach(([sym,key])=>{
    const chip=document.getElementById('chip-'+sym);
    if(!chip) return;
    const d=map[key];
    if(!d) return;
    const priceEl=chip.querySelector('.ticker-price');
    const chgEl=chip.querySelector('.ticker-change');
    const chg=d.change;
    priceEl.classList.remove('pulse');
    priceEl.textContent=fmtUShort(d.price);
    chgEl.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';
    chgEl.className='ticker-change '+(chg>=0?'up':'dn');
    chip.classList.remove('loading');
  });
  updateManualTickerChips();
}
function updateTickerError(){
  ['BTC','ETH','PAXG'].forEach(sym=>{
    const chip=document.getElementById('chip-'+sym);
    if(!chip) return;
    const p=chip.querySelector('.ticker-price');
    p.classList.remove('pulse');
    if(S.prices[sym]>0){p.textContent=fmtUShort(S.prices[sym]);}
    else{p.textContent='خطا';p.style.color='var(--coral)';}
  });
}
function updateManualTickerChips(){
  const u=document.getElementById('chip-usd-val');
  const e=document.getElementById('chip-eur-val');
  if(u) u.textContent=fmtT(S.usdIRT);
  if(e) e.textContent=fmtT(S.eurIRT);
}

// ── calcs ─────────────────────────────────────────────────────
function monthMetrics(m){
  let inc=0,exp=0;
  S.txs.filter(t=>t.date.startsWith(m)).forEach(t=>{
    const u=toUSD(t.amount,t.currency);
    if(t.type==='income') inc+=u;
    else if(t.type==='expense') exp+=u;
  });
  return{inc,exp,net:inc-exp,sav:inc>0?(inc-exp)/inc:0};
}
function netWorth(){
  let cash=0,inv=0;
  S.accounts.forEach(a=>{ cash+=toUSD(a.balance, a.currency); });
  S.investments.forEach(i=>{ inv+=toUSD(i.qty*i.buyPrice, i.currency); });
  return{cash,inv,total:cash+inv};
}
function accBal(id){
  const a=S.accounts.find(x=>x.id===id);
  if(!a) return{raw:0,u:0,irt:0,currency:'IRT'};
  let bal=a.balance;
  S.txs.forEach(t=>{
    const isIRT=a.currency==='IRT';
    const conv=isIRT?toIRT(t.amount,t.currency):toUSD(t.amount,t.currency);
    if(t.accountTo===id)   bal+=conv;
    if(t.accountFrom===id) bal-=conv;
  });
  return{raw:bal, u:toUSD(bal,a.currency), irt:toIRT(bal,a.currency), currency:a.currency};
}

function drawChart(){
  const canvas=document.getElementById('trend-chart');
  if(!canvas||!window.Chart) return;
  const labels=[],incArr=[],expArr=[];
  for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);const mt=monthMetrics(m);labels.push(MONTHS[+m.split('-')[1]-1]);incArr.push(+mt.inc.toFixed(2));expArr.push(+mt.exp.toFixed(2));}
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const tc=dark?'#888780':'#888780'; const gc=dark?'#2a2a27':'#f5f5f3';
  if(S.chart) S.chart.destroy();
  S.chart=new Chart(canvas,{type:'bar',data:{labels,datasets:[

    {label:'هزینه',data:expArr,backgroundColor:'rgba(216,90,48,0.75)',borderRadius:4,borderSkipped:false},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:11},callback:v=>'$'+v},grid:{color:gc}}}}});
}

  const date=document.getElementById('txdate').value;
  const type=document.getElementById('txtype').value;
  if(!desc||!amount||isNaN(amount)||!date){alert('لطفاً همه فیلدها را پر کنید');return}
  const acc=S.accounts.find(a=>a.id===accId);
  S.txs.push({id:'tx'+Date.now(),date,desc,amount,currency,category,type,accountFrom:type==='expense'?accId:undefined,accountTo:type==='income'?accId:undefined,account:acc?.name});
  save();closeModal();render();
}
function editTx(id){
  const t=S.txs.find(x=>x.id===id);if(!t)return;
  const usd=toUSD(t.amount,t.currency); const irt=toIRT(t.amount,t.currency);
  modal(`<div class="modal-handle"></div><div class="modal-title">${t.desc}</div>
    <div class="card" style="margin-bottom:16px">
      <div class="info-row"><span style="color:var(--text3)">مبلغ</span><span style="font-weight:500">${t.currency==='IRT'?fmtT(t.amount)+' ت':fmtU(usd)}</span></div>
      <div class="info-row"><span style="color:var(--text3)">معادل</span><span>${t.currency==='IRT'?fmtU(usd):fmtT(irt)+' ت'}</span></div>
      <div class="info-row"><span style="color:var(--text3)">دسته</span><span>${t.category}</span></div>
      <div class="info-row"><span style="color:var(--text3)">تاریخ</span><span>${t.date}</span></div>
      <div class="info-row"><span style="color:var(--text3)">حساب</span><span>${t.account||'-'}</span></div>
    </div>
    <button class="btn" style="color:var(--coral);border-color:var(--coral-lt)" onclick="deleteTx('${id}')">حذف تراکنش</button>
    <button class="btn" onclick="closeModal()">بستن</button>`);
}
function deleteTx(id){if(!confirm('حذف شود؟'))return;S.txs=S.txs.filter(t=>t.id!==id);save();closeModal();render();}

function openAddAccount(){
  modal(`<div class="modal-handle"></div><div class="modal-title">افزودن حساب جدید</div>
    <div class="field"><label>نام حساب</label><input id="aname" placeholder="مثلاً: بانک صادرات" autocomplete="off"></div>
    <div class="two-col">
      <div class="field"><label>نوع</label><select id="atype"><option value="bank">بانکی</option><option value="cash">نقد</option><option value="investment">سرمایه</option><option value="crypto">کریپتو</option></select></div>
      <div class="field"><label>ارز</label><select id="acur"><option value="IRT">تومان</option><option value="USD">دلار</option><option value="EUR">یورو</option></select></div>
    </div>
    <div class="field"><label>موجودی اولیه</label><input type="number" id="abal" placeholder="0" inputmode="decimal"></div>
    <button class="btn btn-primary" onclick="saveAccount()">ذخیره</button><button class="btn" onclick="closeModal()">انصراف</button>`);
}
function saveAccount(){
  const name=document.getElementById('aname').value.trim();
  const type=document.getElementById('atype').value;
  const currency=document.getElementById('acur').value;
  const balance=parseFloat(document.getElementById('abal').value)||0;
  if(!name){alert('نام حساب را وارد کنید');return}
  S.accounts.push({id:'a'+Date.now(),name,type,currency,balance});save();closeModal();render();
}
function editAccount(id){
  const a=S.accounts.find(x=>x.id===id);if(!a)return;const b=accBal(id);
  modal(`<div class="modal-handle"></div><div class="modal-title">${a.name}</div>
    <div class="card" style="text-align:center;margin-bottom:16px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:6px">موجودی فعلی</div>
      <div style="font-size:26px;font-weight:500">${a.currency==='IRT'?fmtT(b.raw)+' ت':fmtU(b.raw)}</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">${a.currency==='IRT'?fmtU(b.u):fmtT(b.irt)+' ت'}</div>
    </div>
    <button class="btn" style="color:var(--coral);border-color:var(--coral-lt)" onclick="if(confirm('حذف شود؟')){S.accounts=S.accounts.filter(x=>x.id!=='${id}');save();closeModal();render()}">حذف حساب</button>
    <button class="btn" onclick="closeModal()">بستن</button>`);
}

function openAddInv(){
  modal(`<div class="modal-handle"></div><div class="modal-title">افزودن سرمایه‌گذاری</div>
    <div class="field"><label>نام دارایی</label><input id="iname" placeholder="مثلاً: بیت‌کوین" autocomplete="off"></div>
    <div class="field"><label>نوع</label><select id="itype">${CATS.investment.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="two-col">
      <div class="field"><label>تعداد</label><input type="number" id="iqty" placeholder="0" step="any" inputmode="decimal"></div>
      <div class="field"><label>قیمت خرید هر واحد</label><input type="number" id="iprice" placeholder="0" inputmode="decimal"></div>
    </div>
    <div class="field"><label>ارز قیمت خرید</label><select id="icur"><option value="USD">دلار / تتر</option><option value="IRT">تومان</option></select></div>
    <button class="btn btn-primary" onclick="saveInv()">ذخیره</button><button class="btn" onclick="closeModal()">انصراف</button>`);
}
function saveInv(){
  const name=document.getElementById('iname').value.trim();const type=document.getElementById('itype').value;
  const qty=parseFloat(document.getElementById('iqty').value)||0;const buyPrice=parseFloat(document.getElementById('iprice').value)||0;
  const currency=document.getElementById('icur').value;
  if(!name||!qty){alert('اطلاعات را کامل کنید');return}
  S.investments.push({id:'i'+Date.now(),name,type,qty,buyPrice,currency});save();closeModal();render();
}
function editInv(id){
  const i=S.investments.find(x=>x.id===id);if(!i)return;const v=toUSD(i.qty*i.buyPrice,i.currency);
  modal(`<div class="modal-handle"></div><div class="modal-title">${i.name}</div>
    <div class="card" style="text-align:center;margin-bottom:16px">
      <div style="font-size:12px;color:var(--text3);margin-bottom:6px">ارزش تخمینی</div>
      <div style="font-size:26px;font-weight:500;color:var(--purple)">${fmtU(v)}</div>
      <div style="font-size:13px;color:var(--text3);margin-top:4px">${i.qty} واحد × ${i.currency==='IRT'?fmtT(i.buyPrice)+' ت':fmtU(i.buyPrice)}</div>
    </div>
    <button class="btn" style="color:var(--coral);border-color:var(--coral-lt)" onclick="if(confirm('حذف شود؟')){S.investments=S.investments.filter(x=>x.id!=='${id}');save();closeModal();render()}">حذف</button>
    <button class="btn" onclick="closeModal()">بستن</button>`);
}

function exportData(){
  const d={txs:S.txs,accounts:S.accounts,investments:S.investments,usdIRT:S.usdIRT,eurIRT:S.eurIRT,prices:S.prices,exported:new Date().toISOString()};
  const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='finance-backup-'+today()+'.json';a.click();
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.txs)S.txs=d.txs;if(d.accounts)S.accounts=d.accounts;if(d.investments)S.investments=d.investments;if(d.usdIRT)S.usdIRT=d.usdIRT;if(d.eurIRT)S.eurIRT=d.eurIRT;if(d.prices)S.prices=d.prices;save();render();toast('بکاپ بارگذاری شد ✓','ok')}catch{alert('فایل معتبر نیست')}};r.readAsText(f)};inp.click();
}
function clearAll(){if(!confirm('همه تراکنش‌ها پاک شوند؟'))return;S.txs=[];save();render();toast('پاک شد','ok');}

function toast(msg,type='ok'){
  const old=document.getElementById('_t');if(old)old.remove();
  const t=document.createElement('div');t.id='_t';
  t.style.cssText=`position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:999;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:${type==='ok'?'var(--teal)':'var(--amber)'};color:#fff`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2400);
}
function modal(html){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

// ── init ──────────────────────────────────────────────────────
render();
updateManualTickerChips();
// fetch crypto prices on load
setTimeout(()=>fetchPrices(), 500);
// refresh every 30 seconds
setInterval(()=>fetchPrices(), 30*1000);
// refresh on app focus
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const stale=!S.priceAt||Date.now()-new Date(S.priceAt).getTime()>60*1000;
    if(stale) fetchPrices();
  }
});
</script>
</body>
</html>
