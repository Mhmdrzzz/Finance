<!DOCTYPE html>

<title>سیستم مالی شخصی</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#fff;--bg1:#f5f5f3;--bg2:#ebebea;
--t1:#1a1a18;--t2:#555551;--t3:#888780;
--bd:#e0dfd8;
--teal:#1D9E75;--tealL:#E1F5EE;--tealD:#085041;
--coral:#D85A30;--coralL:#FAECE7;--coralD:#4A1B0C;
--blue:#378ADD;--blueL:#E6F1FB;--blueD:#0C447C;
--amber:#BA7517;--amberL:#FAEEDA;--amberD:#633806;
--purple:#534AB7;--purpleL:#EEEDFE;--purpleD:#26215C;
--red:#E24B4A;--redL:#FCEBEB;--redD:#501313;
--green:#639922;--greenL:#EAF3DE;--greenD:#173404;
--gold:#BA7517;--goldL:#FAEEDA;
--r:8px;--rl:12px;--rx:16px;
}
@media(prefers-color-scheme:dark){:root{
--bg0:#1c1c1a;--bg1:#232320;--bg2:#2a2a27;
--t1:#f0efe8;--t2:#b4b2a9;--t3:#888780;
--bd:#38382f;
--teal:#5DCAA5;--tealL:#04342C;--tealD:#9FE1CB;
--coral:#F0997B;--coralL:#4A1B0C;--coralD:#F5C4B3;
--blue:#85B7EB;--blueL:#042C53;--blueD:#B5D4F4;
--amber:#EF9F27;--amberL:#412402;--amberD:#FAC775;
--purple:#AFA9EC;--purpleL:#26215C;--purpleD:#CECBF6;
--red:#F09595;--redL:#501313;--redD:#F7C1C1;
--green:#97C459;--greenL:#173404;--greenD:#C0DD97;
--gold:#EF9F27;--goldL:#412402;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--t1);font-size:15px;direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg0)}
.top{background:var(--bg0);border-bottom:.5px solid var(--bd);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-t{font-size:17px;font-weight:600}
.top-s{font-size:11px;color:var(--t3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding-bottom:96px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg0);border-top:.5px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:98}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 1px;cursor:pointer;gap:2px}
.nav-l{font-size:9px;color:var(--t3)}
.nav-i.active .nav-l{color:var(--teal);font-weight:600}
.sec{padding:14px 16px}
.card{background:var(--bg0);border:.5px solid var(--bd);border-radius:var(--rl);padding:14px;margin-bottom:10px}
.st{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:9px;letter-spacing:.3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.m{border-radius:var(--r);padding:11px;background:var(--bg1)}
.m-l{font-size:10px;color:var(--t3);margin-bottom:3px}
.m-v{font-size:17px;font-weight:600}
.m-s{font-size:10px;color:var(--t3);margin-top:2px}
.m.teal{background:var(--tealL)}.m.teal .m-v{color:var(--tealD)}
.m.coral{background:var(--coralL)}.m.coral .m-v{color:var(--coral)}
.m.blue{background:var(--blueL)}.m.blue .m-v{color:var(--blue)}
.m.purple{background:var(--purpleL)}.m.purple .m-v{color:var(--purple)}
.m.red{background:var(--redL)}.m.red .m-v{color:var(--red)}
.m.green{background:var(--greenL)}.m.green .m-v{color:var(--green)}
.m.gold{background:var(--goldL)}.m.gold .m-v{color:var(--gold)}
.hero{border-radius:var(--rx);padding:18px;margin-bottom:10px;text-align:center}
.hero.teal{background:var(--tealL);border:.5px solid var(--teal)}
.hero.teal .h-l{color:var(--tealD)}.hero.teal .h-v{color:var(--tealD)}.hero.teal .h-s{color:var(--teal)}
.hero.red{background:var(--redL);border:.5px solid var(--red)}
.hero.red .h-l{color:var(--redD)}.hero.red .h-v{color:var(--red)}.hero.red .h-s{color:var(--red)}
.hero.purple{background:var(--purpleL);border:.5px solid var(--purple)}
.hero.purple .h-l{color:var(--purpleD)}.hero.purple .h-v{color:var(--purple)}.hero.purple .h-s{color:var(--purple)}
.h-l{font-size:11px;margin-bottom:3px}
.h-v{font-size:25px;font-weight:600;line-height:1.2}
.h-s{font-size:12px;margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:var(--r);border:.5px solid var(--bd);background:var(--bg0);color:var(--t1);font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px}
.btn:active{opacity:.75;transform:scale(.985)}
.btn:disabled{opacity:.55}
.btn-p{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-ai{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-d{color:var(--coral);border-color:var(--coralL)}
.btn-s{padding:5px 11px;font-size:12px;width:auto;margin-bottom:0}
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;background:var(--teal);color:#fff;border:none;border-radius:50%;width:54px;height:54px;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(29,158,117,.4);z-index:97}
.fab:active{transform:scale(.93)}
.tick{display:flex;gap:6px;overflow-x:auto;padding:7px 12px;border-bottom:.5px solid var(--bd);scrollbar-width:none;background:var(--bg0)}
.tick::-webkit-scrollbar{display:none}
.tk{flex-shrink:0;background:var(--bg1);border:.5px solid var(--bd);border-radius:var(--r);padding:5px 9px;min-width:72px;cursor:pointer}

.tk-p{font-size:12px;font-weight:600}
.tk-c{font-size:9px}
.up{color:var(--teal)}.dn{color:var(--coral)}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.3}}
.pul{animation:bl 1s infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:sp .7s linear infinite}
.row{display:flex;align-items:center;gap:11px;padding:11px;background:var(--bg0);border:.5px solid var(--bd);border-radius:var(--r);margin-bottom:7px;cursor:pointer}

.rt{text-align:left;flex-shrink:0}

.pos{color:var(--teal)}.neg{color:var(--coral)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}

.mt{font-size:17px;font-weight:600;margin-bottom:16px;text-align:center}
.f{margin-bottom:12px}

.tg-lbl{font-size:13px;color:var(--t1);flex:1}
.tg-sub{font-size:10px;color:var(--t3);margin-top:2px}
.tg-sw{width:46px;height:27px;border-radius:14px;background:var(--bd);position:relative;flex-shrink:0;transition:background .2s}

.seg{display:flex;background:var(--bg1);border-radius:var(--r);padding:3px;gap:2px;margin-bottom:12px}
.sg{flex:1;padding:8px 3px;text-align:center;border-radius:6px;font-size:12px;cursor:pointer;color:var(--t2)}
.sg.active{background:var(--bg0);color:var(--t1);font-weight:600;border:.5px solid var(--bd)}
.ir{display:flex;justify-content:space-between;padding:7px 0;border-bottom:.5px solid var(--bd);font-size:13px;gap:8px}
.ir:last-child{border-bottom:none}
.pg{height:5px;background:var(--bg1);border-radius:3px;overflow:hidden;margin-top:5px}
.pgf{height:100%;border-radius:3px}
.bdg{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600}
.bdg.gold{background:var(--goldL);color:var(--gold)}
.bdg.blue{background:var(--blueL);color:var(--blue)}
.bdg.teal{background:var(--tealL);color:var(--tealD)}
.bdg.red{background:var(--redL);color:var(--red)}
.bdg.green{background:var(--greenL);color:var(--greenD)}
.al{border-radius:var(--r);padding:10px 12px;margin-bottom:9px;font-size:12px;display:flex;align-items:flex-start;gap:7px;line-height:1.55}
.al.w{background:var(--amberL);border:.5px solid var(--amber);color:var(--amberD)}
.al.d{background:var(--redL);border:.5px solid var(--red);color:var(--redD)}
.al.i{background:var(--blueL);border:.5px solid var(--blue);color:var(--blueD)}
.al.g{background:var(--greenL);border:.5px solid var(--green);color:var(--greenD)}
.emp{text-align:center;padding:36px 20px;color:var(--t3)}
.mrow{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.mrow::-webkit-scrollbar{display:none}
.mc{flex-shrink:0;padding:5px 12px;border-radius:20px;font-size:12px;cursor:pointer;border:.5px solid var(--bd);background:var(--bg0);color:var(--t2)}
.mc.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.alloc{display:flex;align-items:center;gap:8px;padding:9px;background:var(--bg1);border-radius:var(--r);margin-bottom:6px}
.alloc-n{flex:1;min-width:0}
.alloc-t{font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alloc-s{font-size:10px;color:var(--t3)}
.alloc-in{width:94px;padding:6px 8px;border:.5px solid var(--bd);border-radius:6px;background:var(--bg0);color:var(--t1);font-size:13px;font-family:inherit;text-align:left}
.alloc-sel{width:74px;padding:6px 3px;border:.5px solid var(--bd);border-radius:6px;background:var(--bg0);color:var(--t1);font-size:11px;font-family:inherit}
.hl{background:var(--bg1);border-radius:var(--r);padding:10px;margin-bottom:7px;font-size:12px;line-height:1.6}
.aim{background:var(--purpleL);border:.5px solid var(--purple);border-radius:var(--r);padding:12px;margin-bottom:10px;font-size:13px;line-height:1.8;color:var(--t1);white-space:pre-wrap}
.dd{font-size:10px;color:var(--t3);text-align:center;padding:8px;line-height:1.5}
.rate-src{font-size:9px;color:var(--t3);margin-top:2px}
</style>
</head>

<script>
/*═══════ JALALI ═══════*/
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){
  const gdm=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  const jdm=[0,31,31,31,31,31,31,30,30,30,30,30,29];
  let jy,i;
  if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  const gy2=(gm>2)?(gy+1):gy;
  let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);
  for(i=0;i<gm-1;i++)d+=gdm[i+1];
  d+=gd-1;
  let jd=d-79,np=Math.floor(jd/12053);jd%=12053;
  jy+=33*np+4*Math.floor(jd/1461);jd%=1461;
  if(jd>=366){jy+=Math.floor((jd-1)/365);jd=(jd-1)%365}
  for(i=0;i<11&&jd>=jdm[i+1];i++)jd-=jdm[i+1];
  return{jy,jm:i+1,jd:jd+1};
}
function j2g(jy,jm,jd){
  jy+=1595;
  let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*Math.floor(d/146097);d%=146097;
  if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}
  gy+=4*Math.floor(d/1461);d%=1461;
  if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}
  let gd=d+1;
  const sal=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm;for(gm=1;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];
  return{gy,gm,gd};
}
function dj(s){if(!s)return{jy:0,jm:0,jd:0};const[y,m,d]=s.split('-').map(Number);return g2j(y,m,d)}
function jKey(s){const{jy,jm}=dj(s);return jy+'-'+String(jm).padStart(2,'0')}
function curJ(){return jKey(new Date().toISOString().split('T')[0])}
function fjd(s){if(!s)return'';const{jy,jm,jd}=dj(s);return jd+' '+JM[jm-1]+' '+jy}
function fjm(k){if(!k)return'';const[y,m]=k.split('-').map(Number);return JM[m-1]+' '+y}
function inJM(d,k){return d&&k&&jKey(d)===k}
function last12J(){const a=[],c=curJ(),[cy,cm]=c.split('-').map(Number);
  for(let i=11;i>=0;i--){let m=cm-i,y=cy;while(m<=0){m+=12;y--}a.push(y+'-'+String(m).padStart(2,'0'))}return a}
function daysTo(s){if(!s)return null;return Math.ceil((new Date(s)-new Date())/864e5)}

/*═══════ STORAGE ═══════*/
function db(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem('fx2_'+k)||'null')}catch{return null}}try{localStorage.setItem('fx2_'+k,JSON.stringify(v))}catch(e){}}

const BANKS=['سامان','ملت','شهر','مهر','رسالت'];
const DEBTS0=[

function goldCalc(){ // fallback: from PAXG × USD
  if(!S.prices.PAXG||!S.usdIRT)return 0;
  return (S.prices.PAXG/31.1035)*0.750*S.usdIRT;
}
function goldPrice(){return S.gold18||goldCalc()}
function toIRT(a,c){
  if(!a||isNaN(a))return 0;
  if(c==='IRT')return a;
  if(c==='USD'||c==='USDT')return a*S.usdIRT;
  if(c==='EUR')return a*S.eurIRT;
  if(c==='PAXG')return a*S.prices.PAXG*S.usdIRT;
  if(c==='GOLD18')return a*goldPrice();
  if(c==='BTC')return a*S.prices.BTC*S.usdIRT;
  if(c==='ETH')return a*S.prices.ETH*S.usdIRT;
  return a;
}
function toUSD(a,c){const i=toIRT(a,c);return S.usdIRT>0?i/S.usdIRT:0}
function fT(n){if(!n&&n!==0)return'۰';return Math.round(n).toLocaleString('fa-IR')}
function fM(n){const a=Math.abs(n);
  if(a>=1e9)return(n/1e9).toLocaleString('fa-IR',{maximumFractionDigits:2})+' میلیارد';
  if(a>=1e6)return(n/1e6).toLocaleString('fa-IR',{maximumFractionDigits:0})+' میلیون';
  return fT(n)}
function fU(n){return'$'+(n||0).toFixed(2)}
function fUS(n){if(n>=1000)return'$'+Math.round(n).toLocaleString('en-US');return'$'+(n||0).toFixed(2)}
function todayS(){return new Date().toISOString().split('T')[0]}
function ago(iso){if(!iso)return'هرگز';const s=Math.floor((Date.now()-new Date(iso))/1000);
  if(s<60)return'الان';if(s<3600)return Math.floor(s/60)+'د پیش';if(s<86400)return Math.floor(s/3600)+'س پیش';return Math.floor(s/86400)+'ر پیش'}

const RATE_TTL=12*3600*1000; // 12h

async function fetchIranRates(force){
  if(S.rateBusy)return;
  if(!S.apiKey){if(force)needKey();return}

  if(S.page==='settings')render();

    const prompt=`امروز ${new Date().toLocaleDateString('en-CA')} است. با استفاده از وب‌سرچ، قیمت لحظه‌ای بازار آزاد ایران را پیدا کن:
1. دلار آمریکا (بازار آزاد/سکه و ارز) به تومان

{"usd":عدد,"eur":عدد,"gold18":عدد,"source":"نام منبع","note":"یک جمله کوتاه درباره روند"}`;

    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:700,tools:[{type:'web_search_20250305',name:'web_search',max_uses:3}],messages:[{role:'user',content:prompt}]})
    });
    if(!res.ok){const t=await res.text();throw new Error('API '+res.status+' — '+t.slice(0,120))}
    const data=await res.json();
    let txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n').trim();
    txt=txt.replace(/```json/gi,'').replace(/```/g,'').trim();
    const m=txt.match(/\{[\s\S]*\}/);
    if(!m)throw new Error('فرمت پاسخ نامعتبر');
    const j=JSON.parse(m[0]);

    if(usd<10000||usd>50000000)throw new Error('نرخ دلار غیرمنطقی: '+usd);

    S.rateAt=new Date().toISOString();

    save();syncTick();
    if(force)toast('نرخ‌ها بروزرسانی شد ✓');

  S.rateBusy=false;
  syncTick();
}

/*═══════ CALC ═══════*/
function holdCur(k){return k==='gold18'?'GOLD18':k==='paxg'?'PAXG':k==='usd'?'USD':k==='usdt'?'USDT':k==='eur'?'EUR':'IRT'}
function holdIRT(h){return toIRT(h.qty,holdCur(h.kind))}
function debtAlloc(id){return S.holdings.filter(h=>h.allocTo===id).reduce((s,h)=>s+holdIRT(h),0)}
function debtRem(d){return Math.max(0,d.total-d.paid)}
function debtNet(d){return Math.max(0,debtRem(d)-debtAlloc(d.id))}
function totalDebt(){return S.debts.reduce((s,d)=>s+debtRem(d),0)}
function totalDebtNet(){return S.debts.reduce((s,d)=>s+debtNet(d),0)}
function totalCash(){return S.accounts.reduce((s,a)=>s+toIRT(a.balance,a.cur),0)}
function totalHold(){return S.holdings.reduce((s,h)=>s+holdIRT(h),0)}
function netWorth(){return totalCash()+totalHold()-totalDebt()}
function commitTotal(){return S.commits.reduce((s,c)=>s+toIRT(c.amount,c.cur),0)}
function commitPaid(cid,jm){return S.txs.filter(t=>t.commitId===cid&&inJM(t.date,jm)).reduce((s,t)=>s+toIRT(t.amount,t.cur),0)}
function flowAccs(){return S.accounts.filter(a=>a.forFlow)}
function monthMetrics(jm){let i=0,e=0;S.txs.filter(t=>inJM(t.date,jm)).forEach(t=>{const u=toIRT(t.amount,t.cur);if(t.type==='income')i+=u;else e+=u});return{inc:i,exp:e}}

/*═══════ ALLOCATION ENGINE ═══════*/
function suggest(amt){
  let left=amt;const out=[];const jm=curJ();
  const vat=S.debts.find(d=>d.prio===1&&debtNet(d)>0);
  if(vat&&left>0){
    const days=daysTo(vat.due),rem=debtNet(vat);
    let sh=days===null?.25:days<=14?1:days<=30?.6:days<=60?.4:.3;
    const a=Math.min(rem,Math.round(left*sh));
    if(a>0){out.push({key:'debt:'+vat.id,label:vat.name,amount:a,form:'irt',note:days!==null?days+' روز مانده':'',urgent:days!==null&&days<=30});left-=a}
  }
  let due=0;S.commits.forEach(c=>{const n=toIRT(c.amount,c.cur)-commitPaid(c.id,jm);if(n>0)due+=n});
  if(due>0&&left>0){const a=Math.min(due,left);out.push({key:'commits',label:'تعهدات ماهانه ('+fjm(jm)+')',amount:a,form:'irt',note:'باقی: '+fM(due)});left-=a}
  for(const d of S.debts.filter(x=>x.prio>1&&debtNet(x)>0).sort((a,b)=>a.prio-b.prio)){
    if(left<=0)break;
    const a=Math.min(debtNet(d),Math.round(left*.5));
    if(a>1e6){out.push({key:'debt:'+d.id,label:d.name,amount:a,form:'irt',note:'مانده: '+fM(debtNet(d))});left-=a}
  }
  if(left>0){const fa=flowAccs();if(fa.length){const a=Math.min(left,Math.round(amt*.08));
    if(a>0){const t=[...fa].sort((x,y)=>x.balance-y.balance)[0];out.push({key:'flow:'+t.id,label:'گردش حساب — '+t.name,amount:a,form:'irt',note:'برای اعتبار وام'});left-=a}}}
  if(left>0){const a=Math.round(left*.6);if(a>0){out.push({key:'save:gold',label:'پس‌انداز طلا / دلار',amount:a,form:'gold18',note:'ذخیره ارزش'});left-=a}}
  if(left>0){out.push({key:'travel',label:'پس‌انداز سفر',amount:left,form:'irt',note:''});left=0}
  return out;
}

  const T={dashboard:'داشبورد',income:S.entryMode==='expense'?'ثبت هزینه':'ثبت ورودی',debts:'بدهی‌ها',assets:'دارایی‌ها',monthly:'تعهدات ماهانه',reports:'گزارش و تحلیل',settings:'تنظیمات'};
  document.getElementById('pt').textContent=T[S.page]||'';
  document.getElementById('ps').textContent=S.page==='dashboard'||S.page==='reports'?fjm(S.jMonth):'';
  syncTick();
  c.innerHTML=({dashboard:rDash,income:rIncome,debts:rDebts,assets:rAssets,monthly:rMonthly,reports:rReports,settings:rSet}[S.page]||rDash)();
}

/*═══════ DASHBOARD ═══════*/
function rDash(){
  const nw=netWorth(),td=totalDebt(),tdn=totalDebtNet(),tc=totalCash(),th=totalHold();
  const vat=S.debts.find(d=>d.prio===1),vd=vat?daysTo(vat.due):null,vr=vat?debtNet(vat):0;
  const jm=S.jMonth,ct=commitTotal();
  let cp=0;S.commits.forEach(c=>cp+=Math.min(toIRT(c.amount,c.cur),commitPaid(c.id,jm)));
  const cpct=ct>0?Math.round(cp/ct*100):0;
  const al=[];
  if(!S.usdIRT)al.push(`<div class="al w"><span>⚙️</span><div>نرخ دلار موجود نیست — <strong onclick="rateInfo()" style="text-decoration:underline;cursor:pointer">بروزرسانی کن</strong></div></div>`);
  if(vat&&vr>0&&vd!==null)al.push(`<div class="al ${vd<=21?'d':vd<=45?'w':'i'}"><span>${vd<=21?'🔴':'⏰'}</span><div><strong>${vat.name}</strong><br>${fM(vr)} تومان — ${vd<=0?'سررسید گذشته!':vd+' روز مانده'} (${fjd(vat.due)})</div></div>`);
  if(cpct<100&&ct>0)al.push(`<div class="al w"><span>📌</span><div>تعهدات ${fjm(jm)}: <strong>${cpct}%</strong> — ${fM(ct-cp)} باقی</div></div>`);
  const bars=S.debts.filter(d=>debtRem(d)>0).sort((a,b)=>a.prio-b.prio).map(d=>{
    const pp=d.total>0?d.paid/d.total*100:0, ap=d.total>0?debtAlloc(d.id)/d.total*100:0, a=debtAlloc(d.id);
    return `<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
        <span style="color:var(--t2)">${d.prio}. ${d.name}</span>
        <span style="font-weight:600;color:var(--coral)">${fM(debtNet(d))}</span></div>
      <div style="height:8px;background:var(--bg1);border-radius:4px;overflow:hidden;display:flex">
        <div style="width:${pp}%;background:var(--teal)"></div><div style="width:${ap}%;background:var(--gold)"></div></div>
      ${a>0?`<div style="font-size:10px;color:var(--gold);margin-top:2px">🥇 ${fM(a)} در دارایی</div>`:''}
    </div>`}).join('')||'<div style="text-align:center;color:var(--teal);padding:16px">✅ بدهی‌ای باقی نمانده</div>';
  return `<div class="sec">
    ${al.join('')}

    <div class="g3" style="margin-bottom:10px">
      <div class="m green"><div class="m-l">نقدینگی</div><div class="m-v" style="font-size:14px">${fM(tc)}</div></div>
      <div class="m gold"><div class="m-l">دارایی</div><div class="m-v" style="font-size:14px">${fM(th)}</div></div>
      <div class="m red"><div class="m-l">بدهی</div><div class="m-v" style="font-size:14px">${fM(td)}</div></div></div>
    <div class="g3" style="margin-bottom:12px">
      <button class="btn btn-p" onclick="S.entryMode='income';go('income')" style="margin-bottom:0;font-size:12px;padding:10px 4px">💰 ورودی</button>

      <button class="btn btn-ai" onclick="smsPaste()" style="margin-bottom:0;font-size:12px;padding:10px 4px">📋 پیامک</button>
    </div>
    ${(()=>{const e=S.txs.filter(t=>t.type==='expense'&&inJM(t.date,jm)).reduce((s,t)=>s+toIRT(t.amount,t.cur),0);
      return e>0?`<div class="card" onclick="go('reports')" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div><div style="font-size:11px;color:var(--t3)">هزینه‌های ${fjm(jm)}</div>

        <span><span style="display:inline-block;width:8px;height:8px;background:var(--gold);border-radius:2px"></span> در دارایی</span></div></div>
    <div class="card"><div class="st">تعهدات ${fjm(jm)}</div>
      <div class="mrow">${last12J().map(k=>`<div class="mc${jm===k?' active':''}" onclick="S.jMonth='${k}';save();render()">${fjm(k)}</div>`).join('')}</div>
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px">

      <div class="ir"><span style="color:var(--t2)">بدهی کل</span><span style="font-weight:600">${fM(td)}</span></div>
      <div class="ir"><span style="color:var(--t2)">بدهی خالص</span><span style="font-weight:600;color:var(--coral)">${fM(tdn)}</span></div>
      <div class="ir"><span style="color:var(--t2)">تعهد ماهانه</span><span>${fM(ct)}</span></div>
      <div class="ir"><span style="color:var(--t2)">پس‌انداز سفر</span><span style="color:var(--teal)">${fM(S.travelSaved)}</span></div>
      ${goldPrice()?`<div class="ir"><span style="color:var(--t2)">طلا ۱۸ع/گرم</span><span style="color:var(--gold);font-weight:600">${fT(goldPrice())} ت</span></div>`:''}</div>
  </div>`;
}

      <div class="f"><label>واریز به حساب</label><select id="in-acc">${S.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
      <div id="in-jd" style="font-size:11px;color:var(--teal);text-align:center;margin-bottom:10px">📅 ${fjd(todayS())}</div>
      <button class="btn btn-p" onclick="mkDraft()">محاسبه تخصیص ←</button></div>
    ${S.allocLog.length?`<div class="card"><div class="st">آخرین ورودی‌ها</div>${S.allocLog.slice(-5).reverse().map(l=>`
      <div class="row" onclick="viewLog('${l.id}')"><div class="ico" style="background:var(--tealL)">💰</div>
      <div class="inf"><div class="i-t">${l.desc}</div><div class="i-s">${fjd(l.date)} · ${l.lines.length} تخصیص</div></div>
      <div class="rt"><div class="r-m pos">${fM(l.amountIRT)}</div></div></div>`).join('')}</div>`:''}

    <button class="btn btn-ai" onclick="askAI()" ${S.aiBusy?'disabled':''}>${S.aiBusy?'<span class="spin">⟳</span> در حال تحلیل…':'🤖 مشاوره هوشمند (Claude + وب‌سرچ)'}</button>
    <div class="card"><div class="st">تخصیص — هر خط قابل ویرایش است</div>
      ${d.lines.map((l,i)=>`<div class="alloc">

function jdPrev(){const i=document.getElementById('in-date'),e=document.getElementById('in-jd');if(i&&e&&i.value)e.textContent='📅 '+fjd(i.value)}
function mkDraft(){
  const amt=parseFloat(document.getElementById('in-amt').value)||0;
  const cur=document.getElementById('in-cur').value;
  if(!amt){alert('مبلغ را وارد کنید');return}
  if(!S.usdIRT&&cur!=='IRT'){alert('اول نرخ دلار را دریافت کن');return}
  S.draft={amount:amt,cur,amountIRT:toIRT(amt,cur),date:document.getElementById('in-date').value,
    desc:document.getElementById('in-desc').value.trim()||'ورودی',cat:document.getElementById('in-cat').value,
    acc:document.getElementById('in-acc').value,lines:suggest(toIRT(amt,cur))};
  S.aiText='';render();
}
function setAmt(i,v){S.draft.lines[i].amount=parseFloat(v)||0;render()}
function setForm(i,v){S.draft.lines[i].form=v;render()}
function addLine(){
  const o=[...S.debts.filter(d=>debtNet(d)>0).map(d=>({k:'debt:'+d.id,l:d.name})),{k:'commits',l:'تعهدات ماهانه'},
    ...flowAccs().map(a=>({k:'flow:'+a.id,l:'گردش — '+a.name})),{k:'save:gold',l:'پس‌انداز طلا/دلار'},
    {k:'travel',l:'پس‌انداز سفر'},{k:'keep',l:'نگهداری نقد'}];
  modal(`<div class="mh"></div><div class="mt">افزودن خط</div>
    <div class="f"><label>مقصد</label><select id="nl-k">${o.map(x=>`<option value="${x.k}">${x.l}</option>`).join('')}</select></div>
    <div class="f"><label>مبلغ (تومان)</label><input type="number" id="nl-a" inputmode="decimal"></div>
    <button class="btn btn-p" onclick="doAddLine()">افزودن</button><button class="btn" onclick="closeM()">انصراف</button>`);
}
function doAddLine(){
  const k=document.getElementById('nl-k').value,a=parseFloat(document.getElementById('nl-a').value)||0;
  const L={commits:'تعهدات ماهانه','save:gold':'پس‌انداز طلا/دلار',travel:'پس‌انداز سفر',keep:'نگهداری نقد'};
  S.debts.forEach(d=>L['debt:'+d.id]=d.name);S.accounts.forEach(x=>L['flow:'+x.id]='گردش — '+x.name);
  S.draft.lines.push({key:k,label:L[k]||k,amount:a,form:'irt',note:''});closeM();render();
}
function commitDraft(){
  const d=S.draft,sum=d.lines.reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
  if(Math.abs(d.amountIRT-sum)>=1000&&!confirm('مجموع تخصیص با ورودی برابر نیست. ادامه؟'))return;
  const acc=S.accounts.find(a=>a.id===d.acc);
  if(acc)acc.balance+=acc.cur==='IRT'?d.amountIRT:toUSD(d.amountIRT,'IRT');
  S.txs.push({id:'t'+Date.now(),date:d.date,desc:d.desc,amount:d.amount,cur:d.cur,cat:d.cat,type:'income',acc:d.acc});
  const sub=a=>{if(acc)acc.balance-=acc.cur==='IRT'?a:toUSD(a,'IRT')};
  d.lines.forEach((l,i)=>{
    const a=parseFloat(l.amount)||0;if(a<=0)return;
    if(l.key.startsWith('debt:')){
      const dt=S.debts.find(x=>x.id===l.key.split(':')[1]);if(!dt)return;
      if(l.form==='irt'){dt.paid+=a;sub(a);
        S.txs.push({id:'t'+Date.now()+'_'+i,date:d.date,desc:'پرداخت '+dt.name,amount:a,cur:'IRT',cat:'بدهی',type:'expense',acc:d.acc,debtId:dt.id});
      } else {
        const px=l.form==='gold18'?goldPrice():l.form==='paxg'?S.prices.PAXG*S.usdIRT:S.usdIRT;
        if(px>0){S.holdings.push({id:'h'+Date.now()+'_'+i,kind:l.form,qty:a/px,buyPriceIRT:px,allocTo:dt.id,date:d.date,note:'تخصیص '+dt.name});sub(a)}
      }
    } else if(l.key==='commits'){
      let rem=a;S.commits.forEach(c=>{if(rem<=0)return;
        const need=toIRT(c.amount,c.cur)-commitPaid(c.id,curJ());if(need<=0)return;
        const pay=Math.min(need,rem);
        S.txs.push({id:'t'+Date.now()+'_c'+c.id,date:d.date,desc:c.name,amount:pay,cur:'IRT',cat:'تعهد',type:'expense',acc:d.acc,commitId:c.id});
        if(c.kind==='saving')S.travelSaved+=pay;
        sub(pay);rem-=pay});
    } else if(l.key.startsWith('flow:')){
      const t=S.accounts.find(x=>x.id===l.key.split(':')[1]);
      if(t&&acc&&t.id!==acc.id){sub(a);t.balance+=t.cur==='IRT'?a:toUSD(a,'IRT')}
    } else if(l.key==='save:gold'){
      const f=l.form==='irt'?'gold18':l.form;
      const px=f==='gold18'?goldPrice():f==='paxg'?S.prices.PAXG*S.usdIRT:S.usdIRT;
      if(px>0){S.holdings.push({id:'h'+Date.now()+'_s'+i,kind:f,qty:a/px,buyPriceIRT:px,allocTo:null,date:d.date,note:'پس‌انداز'});sub(a)}
    } else if(l.key==='travel'){S.travelSaved+=a;sub(a)}
  });
  const id='L'+Date.now();
  S.allocLog.push({id,date:d.date,desc:d.desc,amountIRT:d.amountIRT,lines:d.lines.map(l=>({key:l.key,label:l.label,amount:l.amount,form:l.form}))});
  S.decisions.push({id,date:d.date,amountIRT:d.amountIRT,ai:S.aiText?S.aiText.slice(0,500):'',final:d.lines.map(l=>({k:l.key,l:l.label,a:l.amount,f:l.form}))});
  if(S.decisions.length>40)S.decisions=S.decisions.slice(-40);
  S.draft=null;S.aiText='';save();go('dashboard');toast('ثبت شد ✓');
}
function viewLog(id){
  const l=S.allocLog.find(x=>x.id===id);if(!l)return;
  const FO={irt:'ریال',gold18:'طلا',paxg:'PAXG',usd:'دلار',usdt:'تتر'};
  modal(`<div class="mh"></div><div class="mt">${l.desc}</div>
    <div class="card"><div class="ir"><span style="color:var(--t3)">مبلغ</span><span style="font-weight:600">${fM(l.amountIRT)}</span></div>
    <div class="ir"><span style="color:var(--t3)">تاریخ</span><span>${fjd(l.date)}</span></div></div>
    <div class="st">تخصیص‌ها</div>${l.lines.map(x=>`<div class="ir"><span style="color:var(--t2)">${x.label}</span><span>${fM(x.amount)} ${x.form!=='irt'?`<span class="bdg gold">${FO[x.form]||x.form}</span>`:''}</span></div>`).join('')}
    <button class="btn" style="margin-top:14px" onclick="closeM()">بستن</button>`);
}

  // by group
  const byG={};exp.forEach(t=>{const g=t.group||'سایر';byG[g]=(byG[g]||0)+toIRT(t.amount,t.cur)});
  const gArr=Object.entries(byG).sort((a,b)=>b[1]-a[1]);

  // by sub
  const byS={};exp.forEach(t=>{const c=t.cat||'—';byS[c]=(byS[c]||0)+toIRT(t.amount,t.cur)});
  const sArr=Object.entries(byS).sort((a,b)=>b[1]-a[1]).slice(0,10);

  // prev month compare

  const prevE=prevK?S.txs.filter(t=>t.type==='expense'&&inJM(t.date,prevK)).reduce((s,t)=>s+toIRT(t.amount,t.cur),0):0;

    </div>
    ${prevK&&prevE>0?`<div class="al ${diff>0?'w':'g'}"><span>${diff>0?'📈':'📉'}</span><div>نسبت به ${fjm(prevK)}: <strong>${diff>0?'+':''}${diff.toFixed(0)}%</strong> (${fM(prevE)} → ${fM(totE)})</div></div>`:''}

    <div class="card"><div class="st">هزینه بر اساس گروه</div>
      ${gArr.length?gArr.map(([g,v])=>{
        const c=S.expCats[g]?.color||'coral';const ic=S.expCats[g]?.icon||'💳';
        return `<div style="margin-bottom:9px">
          <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
            <span style="color:var(--t2)">${ic} ${g}</span>

      :'<div class="emp" style="padding:16px;font-size:13px">هزینه‌ای در این ماه ثبت نشده</div>'}</div>

    ${sArr.length?`<div class="card"><div class="st">۱۰ زیردسته پرهزینه</div>
      ${sArr.map(([c,v])=>`<div style="margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
          <span style="color:var(--t2)">${c}</span><span style="font-weight:600">${fM(v)}</span></div>

    ${(()=>{
      // commitment usage
      const rows=S.commits.filter(c=>c.kind!=='saving').map(c=>{
        const need=toIRT(c.amount,c.cur);
        const used=S.txs.filter(t=>t.commitId===c.id&&inJM(t.date,jm)).reduce((s,t)=>s+toIRT(t.amount,t.cur),0);
        const pct=need>0?Math.round(used/need*100):0;

          <div class="bt" style="height:7px"><div class="bf" style="width:${Math.min(pct,100)}%;background:${pct>100?'var(--coral)':pct>80?'var(--amber)':'var(--teal)'}"></div></div></div>`}).join('');
      return rows?`<div class="card"><div class="st">مصرف بودجه تعهدات</div>${rows}</div>`:''})()}

    <button class="btn" onclick="exportCSV()">📄 خروجی CSV هزینه‌ها</button>
    ${S.apiKey?`<button class="btn btn-ai" onclick="analyzeSpending()" ${S.aiBusy?'disabled':''}>${S.aiBusy?'<span class="spin">⟳</span> تحلیل…':'🤖 تحلیل هوشمند الگوی خرج'}</button>`:''}
    ${S.repText?`<div class="aim">${S.repText}</div>`:''}
    <button class="btn" onclick="go('income')">← بازگشت</button>
  </div>`;
}

function smsLocal(txt){
  // تشخیص محلی بدون API — سریع و رایگان
  const t=txt.replace(/[٬,]/g,'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  let type=null;
  if(/واریز|افزایش|دریافت|بستانکار/.test(txt))type='income';
  if(/برداشت|خرید|انتقال|کاهش|بدهکار|پرداخت/.test(txt))type='expense';
  // بزرگ‌ترین عدد را به عنوان مبلغ در نظر بگیر (معمولاً مانده هم هست، پس اولی را می‌گیریم)
  const nums=(t.match(/\d{4,}/g)||[]).map(Number).filter(n=>n>=10000);
  let amt=nums.length?nums[0]:0;
  const isRial=/ریال/.test(txt);
  if(isRial)amt=Math.round(amt/10);
  // بانک
  let bank=null;
  for(const a of S.accounts){
    const nm=a.name.replace('بانک ','').trim();
    if(txt.includes(nm)){bank=a.id;break}
  }
  return{type,amount:amt,bank,rial:isRial};
}

async function smsParse(){
  const txt=document.getElementById('sms-t').value.trim();
  if(!txt){alert('متن پیامک را وارد کنید');return}
  const st=document.getElementById('sms-st');
  const btn=document.getElementById('sms-go');

  // اول تشخیص محلی
  let r=smsLocal(txt);

  // اگر کلید API هست، با Claude دقیق‌تر کن
  if(S.apiKey){
    if(st)st.innerHTML='<span class="spin">⟳</span> در حال تحلیل با Claude…';
    if(btn)btn.disabled=true;
    try{
      const accList=S.accounts.map(a=>`${a.id}=${a.name}`).join('، ');
      const p=`این یک پیامک بانکی ایرانی است. اطلاعات را استخراج کن.

پیامک:
"""
${txt}
"""

حساب‌های موجود کاربر: ${accList}

فقط یک JSON برگردان بدون هیچ متن اضافه یا markdown:
{"type":"income" یا "expense","amount":عدد به تومان,"date":"YYYY-MM-DD میلادی یا null","bank":"شناسه حساب از لیست بالا یا null","desc":"توضیح کوتاه مثل نام فروشگاه یا مقصد انتقال","confidence":"high" یا "low"}

نکات مهم:
- اگر مبلغ به ریال است، تقسیم بر ۱۰ کن تا تومان شود
- «واریز/افزایش/بستانکار» = income، «برداشت/خرید/انتقال/بدهکار» = expense
- مبلغ «مانده» را با مبلغ تراکنش اشتباه نگیر — مبلغ تراکنش مهم است
- اگر تاریخ شمسی است (مثل 1405/06/22) به میلادی تبدیل کن`;

      const res=await fetch('https://api.anthropic.com/v1/messages',{
        method:'POST',
        headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:400,messages:[{role:'user',content:p}]})
      });
      if(res.ok){
        const d=await res.json();
        let s=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('').trim();
        s=s.replace(/```json/gi,'').replace(/```/g,'').trim();
        const m=s.match(/\{[\s\S]*\}/);
        if(m){
          const j=JSON.parse(m[0]);
          if(j.type)r.type=j.type;
          if(j.amount&&Number(j.amount)>0)r.amount=Math.round(Number(j.amount));
          if(j.bank&&S.accounts.find(a=>a.id===j.bank))r.bank=j.bank;
          r.date=j.date&&/^\d{4}-\d{2}-\d{2}$/.test(j.date)?j.date:null;
          r.desc=j.desc||'';
          r.conf=j.confidence;
        }
      }
    }catch(e){ /* fallback to local */ }
    if(btn)btn.disabled=false;
  }

  if(!r.amount){
    if(st)st.innerHTML='<span style="color:var(--amber)">مبلغ پیدا نشد — دستی وارد کن</span>';
    setTimeout(()=>smsConfirm({type:r.type||'expense',amount:0,bank:r.bank,date:todayS(),desc:''}),400);
    return;
  }
  smsConfirm({type:r.type||'expense',amount:r.amount,bank:r.bank||S.accounts[0]?.id,date:r.date||todayS(),desc:r.desc||'',conf:r.conf});
}

function smsType(t,el){
  document.getElementById('sms-ty').value=t;

}
function smsRenderTarget(t){
  const el=document.getElementById('sms-target');if(!el)return;
  if(t==='income'){el.innerHTML='';return}
  const coms=S.commits.map(c=>`<option value="commit:${c.id}">${c.name}</option>`).join('');
  const dbts=S.debts.filter(d=>debtNet(d)>0).map(d=>`<option value="debt:${d.id}">پرداخت ${d.name}</option>`).join('');
  const cats=Object.entries(S.expCats).map(([g,v])=>`<optgroup label="${v.icon} ${g}">${v.subs.map(s=>`<option value="cat:${g}|${s}">${s}</option>`).join('')}</optgroup>`).join('');

      <option value="transfer">انتقال بین حساب‌ها</option>
    </optgroup>

function smsSubmit(){
  const ty=document.getElementById('sms-ty').value;
  const a=parseFloat(document.getElementById('sms-a').value)||0;
  const ac=document.getElementById('sms-ac').value;
  const dt=document.getElementById('sms-d').value;
  const ds=document.getElementById('sms-ds').value.trim();
  if(!a){alert('مبلغ را وارد کنید');return}

  if(ty==='income'){
    // برو به مسیر تخصیص
    S.draft={amount:a,cur:'IRT',amountIRT:a,date:dt,desc:ds||'واریز بانکی',cat:'پروژه',acc:ac,lines:suggest(a)};
    S.aiText='';closeM();go('income');toast('واریز شناسایی شد — تخصیص را بررسی کن');
    return;
  }

  // برداشت
  const tg=document.getElementById('sms-tg')?.value||'other';
  const acc=S.accounts.find(x=>x.id===ac);
  if(acc)acc.balance-=acc.cur==='IRT'?a:toUSD(a,'IRT');

  if(tg.startsWith('commit:')){
    const cid=tg.split(':')[1];
    const c=S.commits.find(x=>x.id===cid);
    S.txs.push({id:'t'+Date.now(),date:dt,desc:ds||c?.name||'تعهد',amount:a,cur:'IRT',cat:c?.name||'تعهد',group:null,type:'expense',acc:ac,commitId:cid});
    if(c&&c.kind==='saving')S.travelSaved+=a;
  } else if(tg.startsWith('debt:')){
    const did=tg.split(':')[1];
    const d=S.debts.find(x=>x.id===did);
    if(d)d.paid+=a;
    S.txs.push({id:'t'+Date.now(),date:dt,desc:ds||('پرداخت '+(d?.name||'')),amount:a,cur:'IRT',cat:'بدهی',group:'مالی',type:'expense',acc:ac,debtId:did});
  } else if(tg==='lend'){
    const who=prompt('به چه کسی قرض دادی؟')||'نامشخص';
    S.debts.push({id:'d'+Date.now(),name:'قرض به '+who,party:who,total:a,paid:0,cur:'IRT',due:null,prio:9,type:'شخصی',lent:true});
    S.txs.push({id:'t'+Date.now(),date:dt,desc:ds||('قرض به '+who),amount:a,cur:'IRT',cat:'قرض',group:'خانواده',type:'expense',acc:ac});
    toast('طلب جدید ثبت شد');
  } else if(tg.startsWith('cat:')){
    const [g,sub]=tg.slice(4).split('|');
    S.txs.push({id:'t'+Date.now(),date:dt,desc:ds||sub,amount:a,cur:'IRT',group:g,cat:sub,type:'expense',acc:ac});
  } else {
    S.txs.push({id:'t'+Date.now(),date:dt,desc:ds||'هزینه',amount:a,cur:'IRT',group:'سایر',cat:'متفرقه',type:'expense',acc:ac});
  }
  save();closeM();render();toast('ثبت شد ✓');
}

  try{

      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},

function doPayDebt(id){

    <button class="btn btn-p" onclick="doRelease('${hid}')">تأیید</button><button class="btn" onclick="closeM()">انصراف</button>`),60);
}
function doRelease(hid){
  const h=S.holdings.find(x=>x.id===hid);if(!h)return;
  const m=document.getElementById('rl-m').value,p=parseFloat(document.getElementById('rl-p').value)||holdIRT(h);
  const ac=document.getElementById('rl-a').value,n=document.getElementById('rl-n').value.trim();
  const dn=h.allocTo?(S.debts.find(x=>x.id===h.allocTo)?.name||''):'';
  if(m==='free'){h.allocTo=null;h.note=(h.note||'')+' | آزاد'+(n?': '+n:'')}
  else if(m==='sell'){
    const a=S.accounts.find(x=>x.id===ac);if(a)a.balance+=a.cur==='IRT'?p:toUSD(p,'IRT');
    S.holdings=S.holdings.filter(x=>x.id!==hid);
    S.txs.push({id:'t'+Date.now(),date:todayS(),desc:'فروش دارایی'+(dn?' ('+dn+')':'')+(n?' — '+n:''),amount:p,cur:'IRT',cat:'فروش دارایی',type:'income',acc:ac});
  } else {
    const d=S.debts.find(x=>x.id===h.allocTo);
    if(d){d.paid+=p;S.txs.push({id:'t'+Date.now(),date:todayS(),desc:'پرداخت '+d.name+' از فروش دارایی',amount:p,cur:'IRT',cat:'بدهی',type:'expense',debtId:d.id})}
    S.holdings=S.holdings.filter(x=>x.id!==hid);
  }
  S.decisions.push({id:'R'+Date.now(),date:todayS(),amountIRT:p,final:[{k:'release',l:'آزادسازی '+dn,a:p,f:m}],ai:''});
  save();closeM();render();toast('انجام شد ✓');
}

      <div class="ico" style="background:${pct>=100?'var(--tealL)':c.kind==='saving'?'var(--blueL)':'var(--coralL)'}">${pct>=100?'✅':c.kind==='saving'?'✈️':'📌'}</div>

    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div><div style="font-size:13px;font-weight:600">قیمت‌های Binance</div><div style="font-size:10px;color:var(--t3)">${ago(S.priceAt)} · رایگان</div></div>
        <button class="btn-s btn-p" style="border-radius:6px" onclick="fetchCrypto()">↻</button></div>
      <div class="ir"><span style="color:var(--t2)">PAXG (انس طلا)</span><span style="font-weight:600">${S.prices.PAXG?fUS(S.prices.PAXG):'—'}</span></div>
      <div class="ir"><span style="color:var(--t2)">BTC</span><span style="font-weight:600">${S.prices.BTC?fUS(S.prices.BTC):'—'}</span></div>
      <div class="ir"><span style="color:var(--t2)">ETH</span><span style="font-weight:600">${S.prices.ETH?fUS(S.prices.ETH):'—'}</span></div></div>
    <div class="card">
      <div class="st">🤖 مشاور هوشمند</div>
      <div class="ir"><span style="color:var(--t2)">کلید API</span><span class="bdg ${S.apiKey?'teal':'red'}">${S.apiKey?'فعال':'وارد نشده'}</span></div>
      <button class="btn" style="margin-top:8px" onclick="setKey()">${S.apiKey?'تغییر کلید':'وارد کردن کلید'}</button>
      <div class="dd">نرخ‌گیری با Haiku (ارزان) · مشاوره با Sonnet<br>تخمین هزینه: ~۱.۵ تا ۲ دلار در ماه</div></div>
    <div class="card"><div class="st">دسته‌بندی هزینه‌ها</div>
      ${Object.entries(S.expCats).map(([g,v])=>`
        <div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
            <span style="font-size:13px;font-weight:600">${v.icon} ${g}</span>
            <button class="btn-s" style="border:.5px solid var(--coralL);color:var(--coral);background:transparent;border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px" onclick="delGroup('${g}')">حذف گروه</button></div>
          <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:5px">
            ${v.subs.map(s=>`<span class="cat-tag" style="font-size:11px">${s}<span class="cat-tag-del" onclick="delSub('${g}','${s.replace(/'/g,"")}')">×</span></span>`).join('')}</div>
          <div style="display:flex;gap:5px">
            <input id="ns-${g}" placeholder="زیردسته جدید…" style="flex:1;padding:6px 9px;border:.5px solid var(--bd);border-radius:6px;background:var(--bg1);color:var(--t1);font-size:13px;font-family:inherit">
            <button class="btn-s btn-p" style="border-radius:6px" onclick="addSub('${g}')">+</button></div></div>`).join('')}
      <button class="btn btn-s" style="width:100%;margin-top:6px" onclick="addGroup()">+ افزودن گروه جدید</button></div>
    <div class="card"><div class="st">مدیریت داده</div>
      <button class="btn" onclick="expData()">📥 خروجی بکاپ</button>
      <button class="btn" onclick="impData()">📤 بارگذاری بکاپ</button>
      <button class="btn btn-d" onclick="resetAll()">🗑 ریست کامل</button></div>
    <div class="card"><div class="st">آمار</div>
      <div class="ir"><span style="color:var(--t2)">بدهی‌ها</span><span>${S.debts.length}</span></div>
      <div class="ir"><span style="color:var(--t2)">حساب‌ها</span><span>${S.accounts.length}</span></div>
      <div class="ir"><span style="color:var(--t2)">دارایی‌ها</span><span>${S.holdings.length}</span></div>
      <div class="ir"><span style="color:var(--t2)">ورودی‌های ثبت‌شده</span><span>${S.allocLog.length}</span></div></div>
    <div class="dd">این ابزار برای کمک به تصمیم‌گیری است و توصیه سرمایه‌گذاری محسوب نمی‌شود.</div></div>`;
}
function addSub(g){
  const el=document.getElementById('ns-'+g);const v=el?.value.trim();if(!v)return;
  if(!S.expCats[g].subs.includes(v))S.expCats[g].subs.push(v);
  save();render();
}
function delSub(g,s){
  S.expCats[g].subs=S.expCats[g].subs.filter(x=>x!==s);save();render();
}
function delGroup(g){
  if(!confirm('گروه «'+g+'» و همه زیردسته‌هایش حذف شود؟'))return;
  delete S.expCats[g];save();render();
}
function addGroup(){
  modal(`<div class="mh"></div><div class="mt">افزودن گروه هزینه</div>
    <div class="f"><label>نام گروه</label><input id="ng-n" placeholder="مثلاً: حیوان خانگی"></div>
    <div class="f"><label>ایموجی</label><input id="ng-i" placeholder="🐶" value="💳" style="text-align:center;font-size:22px"></div>
    <div class="f"><label>رنگ</label><select id="ng-c">
      <option value="coral">نارنجی</option><option value="blue">آبی</option><option value="teal">سبز آبی</option>
      <option value="purple">بنفش</option><option value="amber">کهربایی</option><option value="green">سبز</option></select></div>
    <button class="btn btn-p" onclick="doAddGroup()">ذخیره</button><button class="btn" onclick="closeM()">انصراف</button>`);
}
function doAddGroup(){
  const n=document.getElementById('ng-n').value.trim();if(!n){alert('نام را وارد کنید');return}
  if(S.expCats[n]){alert('این گروه از قبل هست');return}
  S.expCats[n]={icon:document.getElementById('ng-i').value.trim()||'💳',color:document.getElementById('ng-c').value,subs:['عمومی']};
  save();closeM();render();toast('گروه اضافه شد ✓');
}

function setKey(){
  modal(`<div class="mh"></div><div class="mt">کلید API</div>
    <div class="f"><label>Anthropic API Key</label><input id="ak" value="${S.apiKey||''}" placeholder="sk-ant-..." style="font-size:13px" autocomplete="off"></div>
    <div class="dd">از console.anthropic.com → API Keys</div>
    <button class="btn btn-p" onclick="S.apiKey=document.getElementById('ak').value.trim();save();closeM();render();toast('ذخیره شد ✓')">ذخیره</button>
    <button class="btn" onclick="closeM()">انصراف</button>`);
}
function expData(){
  const d={};['accounts','holdings','debts','commits','txs','allocLog','decisions','cats','usdIRT','eurIRT','gold18','travelSaved','prices'].forEach(k=>d[k]=S[k]);
  d.exported=new Date().toISOString();
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='finance-'+todayS()+'.json';a.click();
}
function impData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      ['accounts','holdings','debts','commits','txs','allocLog','decisions','cats','usdIRT','eurIRT','gold18','travelSaved','prices'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
      save();render();toast('بارگذاری شد ✓')}catch{alert('فایل معتبر نیست')}};
    r.readAsText(f)};i.click();
}
function resetAll(){
  if(!confirm('همه داده‌ها پاک شوند؟'))return;
  if(!confirm('مطمئنی؟ برگشت‌ناپذیر است.'))return;
  S.accounts=BANKS.map((b,i)=>({id:'a'+(i+1),name:'بانک '+b,type:'bank',cur:'IRT',balance:0,forFlow:['مهر','رسالت','شهر'].includes(b)}));
  S.holdings=[];S.debts=JSON.parse(JSON.stringify(DEBTS0));S.commits=JSON.parse(JSON.stringify(COMMIT0));
  S.txs=[];S.allocLog=[];S.decisions=[];S.travelSaved=0;save();go('dashboard');toast('ریست شد');
}

/*═══════ UI ═══════*/
function toast(m){
  const o=document.getElementById('_t');if(o)o.remove();
  const t=document.createElement('div');t.id='_t';
  t.style.cssText='position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:999;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:var(--teal);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2)';
  t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2300);
}
function modal(h){document.getElementById('mc').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="mod">${h}</div></div>`}
function closeM(){document.getElementById('mc').innerHTML=''}

/*═══════ INIT ═══════*/
render();syncTick();
setTimeout(()=>fetchCrypto(),400);
setTimeout(()=>fetchIranRates(false),1500);
setInterval(()=>fetchCrypto(),60000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    if(!S.priceAt||Date.now()-new Date(S.priceAt)>120000)fetchCrypto();
    fetchIranRates(false);
  }
});
</script>
</body>
</html>
