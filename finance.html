<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#fff;--bg1:#f5f5f3;--bg2:#ebebea;
--t1:#1a1a18;--t2:#555551;--t3:#888780;
--bd:#e0dfd8;
--teal:#1D9E75;--tealL:#E1F5EE;--tealD:#085041;
--coral:#D85A30;--coralL:#FAECE7;--coralD:#4A1B0C;
--blue:#378ADD;--blueL:#E6F1FB;--blueD:#0C447C;
--amber:#BA7517;--amberL:#FAEEDA;--amberD:#633806;
--purple:#534AB7;--purpleL:#EEEDFE;--purpleD:#26215C;
--red:#E24B4A;--redL:#FCEBEB;--redD:#501313;
--green:#639922;--greenL:#EAF3DE;--greenD:#173404;
--gold:#BA7517;--goldL:#FAEEDA;
--r:8px;--rl:12px;--rx:16px;
}
@media(prefers-color-scheme:dark){:root{
--bg0:#1c1c1a;--bg1:#232320;--bg2:#2a2a27;
--t1:#f0efe8;--t2:#b4b2a9;--t3:#888780;
--bd:#38382f;
--teal:#5DCAA5;--tealL:#04342C;--tealD:#9FE1CB;
--coral:#F0997B;--coralL:#4A1B0C;--coralD:#F5C4B3;
--blue:#85B7EB;--blueL:#042C53;--blueD:#B5D4F4;
--amber:#EF9F27;--amberL:#412402;--amberD:#FAC775;
--purple:#AFA9EC;--purpleL:#26215C;--purpleD:#CECBF6;
--red:#F09595;--redL:#501313;--redD:#F7C1C1;
--green:#97C459;--greenL:#173404;--greenD:#C0DD97;
--gold:#EF9F27;--goldL:#412402;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--t1);font-size:15px;direction:rtl;min-height:100vh}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg0)}
.top{background:var(--bg0);border-bottom:.5px solid var(--bd);padding:11px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top-t{font-size:17px;font-weight:500}
.top-s{font-size:11px;color:var(--t3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding-bottom:96px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg0);border-top:.5px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:98}
.nav-i{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 1px;cursor:pointer;gap:2px}
.nav-l{font-size:9px;color:var(--t3)}
.nav-i.active .nav-l{color:var(--teal);font-weight:600}
.sec{padding:14px 16px}
.card{background:var(--bg0);border:.5px solid var(--bd);border-radius:var(--rl);padding:14px;margin-bottom:10px}
.st{font-size:11px;font-weight:600;color:var(--t3);margin-bottom:9px;letter-spacing:.3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.m{border-radius:var(--r);padding:11px;background:var(--bg1)}
.m-l{font-size:10px;color:var(--t3);margin-bottom:3px}
.m-v{font-size:17px;font-weight:600}
.m-s{font-size:10px;color:var(--t3);margin-top:2px}
.m.teal{background:var(--tealL)}.m.teal .m-v{color:var(--tealD)}
.m.coral{background:var(--coralL)}.m.coral .m-v{color:var(--coral)}
.m.blue{background:var(--blueL)}.m.blue .m-v{color:var(--blue)}
.m.purple{background:var(--purpleL)}.m.purple .m-v{color:var(--purple)}
.m.red{background:var(--redL)}.m.red .m-v{color:var(--red)}
.m.green{background:var(--greenL)}.m.green .m-v{color:var(--green)}
.m.gold{background:var(--goldL)}.m.gold .m-v{color:var(--gold)}
.m.amber{background:var(--amberL)}.m.amber .m-v{color:var(--amber)}
.hero{border-radius:var(--rx);padding:18px;margin-bottom:10px;text-align:center}
.hero.teal{background:var(--tealL);border:.5px solid var(--teal)}
.hero.teal .h-l{color:var(--tealD)}.hero.teal .h-v{color:var(--tealD)}.hero.teal .h-s{color:var(--teal)}
.hero.red{background:var(--redL);border:.5px solid var(--red)}
.hero.red .h-l{color:var(--redD)}.hero.red .h-v{color:var(--red)}.hero.red .h-s{color:var(--red)}

.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;background:var(--teal);color:#fff;border:none;border-radius:50%;width:54px;height:54px;font-size:25px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(29,158,117,.4);z-index:97}

.al.d{background:var(--redL);border:.5px solid var(--red);color:var(--redD)}
.al.i{background:var(--blueL);border:.5px solid var(--blue);color:var(--blueD)}

.emp{text-align:center;padding:36px 20px;color:var(--t3)}
.mrow{display:flex;gap:5px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}

/* allocation editor */
.alloc{display:flex;align-items:center;gap:8px;padding:9px;background:var(--bg1);border-radius:var(--r);margin-bottom:6px}
.alloc-n{flex:1;min-width:0}

.alloc-sel{width:76px;padding:6px 4px;border:.5px solid var(--bd);border-radius:6px;background:var(--bg0);color:var(--t1);font-size:11px;font-family:inherit}
.sumbar{position:sticky;bottom:0;background:var(--bg0);border-top:.5px solid var(--bd);padding:10px 0;margin-top:8px}
.hl{background:var(--bg1);border-radius:var(--r);padding:10px;margin-bottom:7px;font-size:12px;line-height:1.6}
.aim{background:var(--purpleL);border:.5px solid var(--purple);border-radius:var(--r);padding:12px;margin-bottom:10px;font-size:13px;line-height:1.75;color:var(--t1);white-space:pre-wrap}
.dd{font-size:10px;color:var(--t3);text-align:center;padding:8px;line-height:1.5}
</style>
</head>

<script>
/*═══════════════ JALALI CALENDAR ═══════════════*/
const JM=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
function g2j(gy,gm,gd){
  const gdm=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  const jdm=[0,31,31,31,31,31,31,30,30,30,30,30,29];
  let jy,jm,jd,i;
  if(gy>1600){jy=979;gy-=1600}else{jy=0;gy-=621}
  const gy2=(gm>2)?(gy+1):gy;
  let d=365*gy+Math.floor((gy2+3)/4)-Math.floor((gy2+99)/100)+Math.floor((gy2+399)/400);
  for(i=0;i<gm-1;i++)d+=gdm[i+1];
  d+=gd-1;
  let jd_=d-79, np=Math.floor(jd_/12053); jd_%=12053;
  jy+=33*np+4*Math.floor(jd_/1461); jd_%=1461;
  if(jd_>=366){jy+=Math.floor((jd_-1)/365);jd_=(jd_-1)%365}
  for(i=0;i<11&&jd_>=jdm[i+1];i++)jd_-=jdm[i+1];
  return{jy,jm:i+1,jd:jd_+1};
}
function j2g(jy,jm,jd){
  jy+=1595;
  let d=-355668+365*jy+Math.floor(jy/33)*8+Math.floor(((jy%33)+3)/4)+jd+((jm<7)?(jm-1)*31:((jm-7)*30)+186);
  let gy=400*Math.floor(d/146097); d%=146097;
  if(d>36524){gy+=100*Math.floor(--d/36524);d%=36524;if(d>=365)d++}
  gy+=4*Math.floor(d/1461); d%=1461;
  if(d>365){gy+=Math.floor((d-1)/365);d=(d-1)%365}
  let gd=d+1;
  const sal=[0,31,((gy%4==0&&gy%100!=0)||(gy%400==0))?29:28,31,30,31,30,31,31,30,31,30,31];
  let gm; for(gm=1;gm<13&&gd>sal[gm];gm++)gd-=sal[gm];
  return{gy,gm,gd};
}
function dj(s){if(!s)return{jy:0,jm:0,jd:0};const[y,m,d]=s.split('-').map(Number);return g2j(y,m,d)}
function jKey(s){const{jy,jm}=dj(s);return jy+'-'+String(jm).padStart(2,'0')}
function curJ(){return jKey(new Date().toISOString().split('T')[0])}
function fjd(s){if(!s)return'';const{jy,jm,jd}=dj(s);return jd+' '+JM[jm-1]+' '+jy}
function fjm(k){if(!k)return'';const[y,m]=k.split('-').map(Number);return JM[m-1]+' '+y}
function inJM(d,k){return d&&k&&jKey(d)===k}
function last12J(){const a=[],c=curJ(),[cy,cm]=c.split('-').map(Number);
  for(let i=11;i>=0;i--){let m=cm-i,y=cy;while(m<=0){m+=12;y--}a.push(y+'-'+String(m).padStart(2,'0'))}return a}
function daysTo(s){if(!s)return null;return Math.ceil((new Date(s)-new Date())/864e5)}

/*═══════════════ STORAGE ═══════════════*/
function db(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem('fx1_'+k)||'null')}catch{return null}}try{localStorage.setItem('fx1_'+k,JSON.stringify(v))}catch(e){}}

/*═══════════════ DEFAULTS ═══════════════*/
const BANKS=['سامان','ملت','شهر','مهر','رسالت'];
const DEBTS0=[

/*═══════════════ MONEY HELPERS ═══════════════*/
function goldGram18(){ // تومان per gram 18k
  if(!S.prices.PAXG||!S.usdIRT)return 0;
  return (S.prices.PAXG/31.1035)*0.750*S.usdIRT*S.goldPremium;
}
function toIRT(a,c){
  if(!a||isNaN(a))return 0;
  if(c==='IRT')return a;
  if(c==='USD'||c==='USDT')return a*S.usdIRT;
  if(c==='EUR')return a*S.eurIRT;
  if(c==='PAXG')return a*S.prices.PAXG*S.usdIRT;
  if(c==='GOLD18')return a*goldGram18();
  if(c==='BTC')return a*S.prices.BTC*S.usdIRT;
  if(c==='ETH')return a*S.prices.ETH*S.usdIRT;
  return a;
}
function toUSD(a,c){const irt=toIRT(a,c);return S.usdIRT>0?irt/S.usdIRT:0}
function fT(n){if(!n&&n!==0)return'۰';return Math.round(n).toLocaleString('fa-IR')}
function fM(n){ // تومان به میلیون/میلیارد
  const abs=Math.abs(n);
  if(abs>=1e9)return (n/1e9).toLocaleString('fa-IR',{maximumFractionDigits:2})+' میلیارد';
  if(abs>=1e6)return (n/1e6).toLocaleString('fa-IR',{maximumFractionDigits:0})+' میلیون';
  return fT(n);
}
function fU(n){return '$'+(n||0).toFixed(2)}
function fUS(n){if(n>=1000)return'$'+Math.round(n).toLocaleString('en-US');return'$'+(n||0).toFixed(2)}
function todayS(){return new Date().toISOString().split('T')[0]}
function ago(iso){if(!iso)return'هرگز';const s=Math.floor((Date.now()-new Date(iso))/1000);if(s<60)return'الان';if(s<3600)return Math.floor(s/60)+'د پیش';if(s<86400)return Math.floor(s/3600)+'س پیش';return Math.floor(s/86400)+'ر پیش'}

/*═══════════════ CALCULATIONS ═══════════════*/
function debtAllocated(debtId){ // مبلغ نگهداری‌شده در دارایی برای این بدهی
  return S.holdings.filter(h=>h.allocTo===debtId).reduce((s,h)=>s+toIRT(h.qty,h.kind==='gold18'?'GOLD18':h.kind==='paxg'?'PAXG':h.kind==='usd'?'USD':h.kind==='usdt'?'USDT':'IRT'),0);
}
function debtRemaining(d){return Math.max(0,d.total-d.paid)}
function debtNet(d){return Math.max(0,debtRemaining(d)-debtAllocated(d.id))}
function totalDebt(){return S.debts.reduce((s,d)=>s+debtRemaining(d),0)}
function totalDebtNet(){return S.debts.reduce((s,d)=>s+debtNet(d),0)}
function totalCash(){return S.accounts.reduce((s,a)=>s+toIRT(a.balance,a.cur),0)}
function holdingIRT(h){
  const cur=h.kind==='gold18'?'GOLD18':h.kind==='paxg'?'PAXG':h.kind==='usd'?'USD':h.kind==='usdt'?'USDT':h.kind==='eur'?'EUR':'IRT';
  return toIRT(h.qty,cur);
}
function totalHoldings(){return S.holdings.reduce((s,h)=>s+holdingIRT(h),0)}
function netWorth(){return totalCash()+totalHoldings()-totalDebt()}
function monthlyCommitTotal(){return S.commits.reduce((s,c)=>s+toIRT(c.amount,c.cur),0)}
function commitPaidThisMonth(cid,jm){
  return S.txs.filter(t=>t.commitId===cid&&inJM(t.date,jm)).reduce((s,t)=>s+toIRT(t.amount,t.cur),0);
}
function flowAccounts(){return S.accounts.filter(a=>a.forFlow)}

/*═══════════════ ALLOCATION ENGINE (rule-based) ═══════════════*/
function suggestAllocation(amountIRT){
  let left=amountIRT;
  const out=[];
  const jm=curJ();

  // 1) ارزش افزوده — بر اساس فوریت
  const vat=S.debts.find(d=>d.prio===1&&debtNet(d)>0);
  if(vat&&left>0){
    const days=daysTo(vat.due);
    const rem=debtNet(vat);
    let share;
    if(days===null)share=0.25;
    else if(days<=14)share=1.0;
    else if(days<=30)share=0.60;
    else if(days<=60)share=0.40;
    else share=0.30;
    const amt=Math.min(rem,Math.round(left*share));
    if(amt>0){out.push({key:'debt:'+vat.id,label:vat.name,amount:amt,form:'irt',note:days!==null?days+' روز مانده':'',urgent:days!==null&&days<=30});left-=amt}
  }

  // 2) تعهدات ماهانه پرداخت‌نشده
  let commitDue=0;
  S.commits.forEach(c=>{
    const need=toIRT(c.amount,c.cur)-commitPaidThisMonth(c.id,jm);
    if(need>0)commitDue+=need;
  });
  if(commitDue>0&&left>0){
    const amt=Math.min(commitDue,left);
    out.push({key:'commits',label:'تعهدات ماهانه ('+fjm(jm)+')',amount:amt,form:'irt',note:'باقی‌مانده: '+fM(commitDue)});
    left-=amt;
  }

  // 3) بدهی‌ها به ترتیب اولویت
  const rest=S.debts.filter(d=>d.prio>1&&debtNet(d)>0).sort((a,b)=>a.prio-b.prio);
  for(const d of rest){
    if(left<=0)break;
    const amt=Math.min(debtNet(d),Math.round(left*0.5));
    if(amt>1000000){out.push({key:'debt:'+d.id,label:d.name,amount:amt,form:'irt',note:'مانده: '+fM(debtNet(d))});left-=amt}
  }

  // 4) گردش بانکی
  if(left>0){
    const fa=flowAccounts();
    if(fa.length){
      const amt=Math.min(left,Math.round(amountIRT*0.08));
      if(amt>0){
        // چرخشی: کم‌ترین موجودی
        const target=[...fa].sort((a,b)=>a.balance-b.balance)[0];
        out.push({key:'flow:'+target.id,label:'گردش حساب — '+target.name,amount:amt,form:'irt',note:'برای اعتبار وام'});
        left-=amt;
      }
    }
  }

  // 5) پس‌انداز طلا/دلار
  if(left>0){
    const amt=Math.round(left*0.6);
    if(amt>0){out.push({key:'save:gold',label:'پس‌انداز طلا / دلار',amount:amt,form:'gold18',note:'ذخیره ارزش'});left-=amt}
  }

  // 6) سفر
  if(left>0){out.push({key:'travel',label:'پس‌انداز سفر',amount:left,form:'irt',note:''});left=0}

  return out;
}

function buildDraft(){
  const amt=parseFloat(document.getElementById('in-amt').value)||0;
  const cur=document.getElementById('in-cur').value;
  const date=document.getElementById('in-date').value;
  const desc=document.getElementById('in-desc').value.trim()||'ورودی';
  const cat=document.getElementById('in-cat').value;
  const acc=document.getElementById('in-acc').value;
  if(!amt){alert('مبلغ را وارد کنید');return}
  if(!S.usdIRT&&cur!=='IRT'){alert('اول نرخ دلار را در تنظیمات وارد کنید');return}
  const amtIRT=toIRT(amt,cur);
  S.draft={amount:amt,cur,amountIRT:amtIRT,date,desc,cat,acc,lines:suggestAllocation(amtIRT)};
  S.aiText='';
  render();
}
function setAmt(i,v){S.draft.lines[i].amount=parseFloat(v)||0;render()}
function setForm(i,v){S.draft.lines[i].form=v;render()}
function addLine(){
  const opts=[
    ...S.debts.filter(d=>debtNet(d)>0).map(d=>({k:'debt:'+d.id,l:d.name})),
    {k:'commits',l:'تعهدات ماهانه'},

    {k:'save:gold',l:'پس‌انداز طلا/دلار'},

    {k:'keep',l:'نگهداری نقد'},
  ];
  modal(`<div class="mh"></div><div class="mt">افزودن خط تخصیص</div>

    <button class="btn" onclick="closeM()">انصراف</button>`);

function doAddLine(){
  const k=document.getElementById('nl-key').value;
  const a=parseFloat(document.getElementById('nl-amt').value)||0;
  const labels={};
  S.debts.forEach(d=>labels['debt:'+d.id]=d.name);
  S.accounts.forEach(x=>labels['flow:'+x.id]='گردش — '+x.name);
  labels['commits']='تعهدات ماهانه';labels['save:gold']='پس‌انداز طلا/دلار';labels['travel']='پس‌انداز سفر';labels['keep']='نگهداری نقد';
  S.draft.lines.push({key:k,label:labels[k]||k,amount:a,form:'irt',note:''});
  closeM();render();
}

function commitDraft(){
  const d=S.draft;
  const sum=d.lines.reduce((s,l)=>s+(parseFloat(l.amount)||0),0);
  if(Math.abs(d.amountIRT-sum)>=1000){
    if(!confirm('مجموع تخصیص با مبلغ ورودی برابر نیست. ادامه می‌دهید؟'))return;
  }
  // 1) واریز به حساب
  const acc=S.accounts.find(a=>a.id===d.acc);
  if(acc)acc.balance+=acc.cur==='IRT'?d.amountIRT:toUSD(d.amountIRT,'IRT');
  // 2) ثبت تراکنش درآمد
  S.txs.push({id:'t'+Date.now(),date:d.date,desc:d.desc,amount:d.amount,cur:d.cur,cat:d.cat,type:'income',acc:d.acc});
  // 3) اعمال هر خط
  d.lines.forEach((l,idx)=>{
    const amt=parseFloat(l.amount)||0; if(amt<=0)return;
    if(l.key.startsWith('debt:')){
      const debt=S.debts.find(x=>x.id===l.key.split(':')[1]); if(!debt)return;
      if(l.form==='irt'){
        debt.paid+=amt;
        if(acc)acc.balance-=acc.cur==='IRT'?amt:toUSD(amt,'IRT');
        S.txs.push({id:'t'+Date.now()+'_'+idx,date:d.date,desc:'پرداخت '+debt.name,amount:amt,cur:'IRT',cat:'بدهی',type:'expense',acc:d.acc,debtId:debt.id});
      } else {
        // نگهداری در دارایی با تخصیص
        const px=l.form==='gold18'?goldGram18():l.form==='paxg'?S.prices.PAXG*S.usdIRT:l.form==='usd'||l.form==='usdt'?S.usdIRT:1;
        const qty=px>0?amt/px:0;
        S.holdings.push({id:'h'+Date.now()+'_'+idx,kind:l.form,qty,buyPriceIRT:px,allocTo:debt.id,date:d.date,note:'تخصیص '+debt.name});
        if(acc)acc.balance-=acc.cur==='IRT'?amt:toUSD(amt,'IRT');
      }
    } else if(l.key==='commits'){
      let rem=amt;
      S.commits.forEach(c=>{
        if(rem<=0)return;
        const need=toIRT(c.amount,c.cur)-commitPaidThisMonth(c.id,curJ());
        if(need<=0)return;
        const pay=Math.min(need,rem);
        S.txs.push({id:'t'+Date.now()+'_c'+c.id,date:d.date,desc:c.name,amount:pay,cur:'IRT',cat:'تعهد',type:'expense',acc:d.acc,commitId:c.id});
        if(acc)acc.balance-=acc.cur==='IRT'?pay:toUSD(pay,'IRT');
        rem-=pay;
      });
    } else if(l.key.startsWith('flow:')){
      const target=S.accounts.find(a=>a.id===l.key.split(':')[1]);
      if(target&&acc&&target.id!==acc.id){
        acc.balance-=acc.cur==='IRT'?amt:toUSD(amt,'IRT');
        target.balance+=target.cur==='IRT'?amt:toUSD(amt,'IRT');
      }
    } else if(l.key==='save:gold'){
      const px=l.form==='gold18'?goldGram18():l.form==='paxg'?S.prices.PAXG*S.usdIRT:S.usdIRT;
      const qty=px>0?amt/px:0;
      S.holdings.push({id:'h'+Date.now()+'_s'+idx,kind:l.form==='irt'?'gold18':l.form,qty,buyPriceIRT:px,allocTo:null,date:d.date,note:'پس‌انداز'});
      if(acc)acc.balance-=acc.cur==='IRT'?amt:toUSD(amt,'IRT');
    } else if(l.key==='travel'){
      S.travelSaved+=amt;
      if(acc)acc.balance-=acc.cur==='IRT'?amt:toUSD(amt,'IRT');
    }
  });
  // 4) لاگ
  const logId='L'+Date.now();
  S.allocLog.push({id:logId,date:d.date,desc:d.desc,amountIRT:d.amountIRT,lines:d.lines.map(l=>({key:l.key,label:l.label,amount:l.amount,form:l.form}))});
  S.decisions.push({id:logId,date:d.date,amountIRT:d.amountIRT,suggested:suggestAllocation(d.amountIRT).map(l=>({k:l.key,a:l.amount})),aiAdvice:S.aiText?S.aiText.slice(0,600):'',final:d.lines.map(l=>({k:l.key,a:l.amount,f:l.form}))});
  if(S.decisions.length>40)S.decisions=S.decisions.slice(-40);
  S.draft=null;S.aiText='';
  save();go('dashboard');toast('ورودی ثبت و تخصیص اعمال شد ✓');
}

async function askAI(){
  if(!S.apiKey){
    modal(`<div class="mh"></div><div class="mt">🤖 مشاوره هوشمند</div>
      <div class="al i" style="margin-bottom:14px"><span>🔑</span><div>برای استفاده از مشاوره هوشمند، کلید API خودت رو وارد کن. از <strong>console.anthropic.com</strong> بگیر و اعتبار ۵ تا ۱۰ دلاری شارژ کن.</div></div>
      <div class="f"><label>Anthropic API Key</label><input id="ak" placeholder="sk-ant-..." autocomplete="off" style="font-size:13px"></div>
      <div class="dd">کلید فقط روی گوشی خودت ذخیره می‌شه و جایی ارسال نمی‌شه جز به سرور Anthropic.</div>
      <button class="btn btn-p" onclick="saveKey()">ذخیره و ادامه</button>
      <button class="btn" onclick="closeM()">بعداً</button>`);
    return;
  }
  if(S.aiBusy)return;
  S.aiBusy=true;render();
  try{
    const ctx=buildAIContext();
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1400,
        tools:[{type:'web_search_20250305',name:'web_search'}],
        messages:[{role:'user',content:ctx}]
      })
    });
    if(!res.ok){const e=await res.text();throw new Error('API '+res.status+': '+e.slice(0,180))}
    const data=await res.json();
    const txt=(data.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n').trim();
    S.aiText=txt||'پاسخی دریافت نشد.';
  }catch(err){
    S.aiText='⚠️ خطا: '+err.message+'\n\nاگر مشکل ادامه داشت، کلید API و اعتبار حساب را چک کن.';
  }
  S.aiBusy=false;render();
}
function saveKey(){
  const k=document.getElementById('ak').value.trim();
  if(!k){alert('کلید را وارد کنید');return}
  S.apiKey=k;save();closeM();toast('کلید ذخیره شد ✓');askAI();
}
function buildAIContext(){
  const d=S.draft;
  const debts=S.debts.filter(x=>debtRemaining(x)>0).sort((a,b)=>a.prio-b.prio).map(x=>{
    const days=daysTo(x.due);
    return `- ${x.name} (${x.party}): مانده ${fM(debtRemaining(x))} تومان، تخصیص‌یافته در دارایی ${fM(debtAllocated(x.id))}، اولویت ${x.prio}${days!==null?`، سررسید ${x.due} (${days} روز مانده)`:'، بدون سررسید'}`;
  }).join('\n');
  const holds=S.holdings.length?S.holdings.map(h=>{
    const nm={gold18:'طلا ۱۸ع (گرم)',paxg:'PAXG',usd:'دلار',usdt:'تتر',irt:'ریال'}[h.kind]||h.kind;
    const al=h.allocTo?S.debts.find(x=>x.id===h.allocTo)?.name||'':'آزاد';
    return `- ${nm}: ${h.qty.toFixed(4)} — ارزش ${fM(holdingIRT(h))} — تخصیص: ${al}`;
  }).join('\n'):'(هیچ)';
  const accs=S.accounts.map(a=>`- ${a.name}: ${fM(toIRT(a.balance,a.cur))}${a.forFlow?' [حساب گردش وام]':''}`).join('\n');
  const commits=S.commits.map(c=>{
    const paid=commitPaidThisMonth(c.id,curJ());
    return `- ${c.name}: ${fM(toIRT(c.amount,c.cur))} ماهانه، این ماه ${fM(paid)} پرداخت شده`;
  }).join('\n');
  const hist=S.decisions.slice(-6).map(x=>{
    const f=x.final.map(y=>`${y.k}=${fM(y.a)}${y.f&&y.f!=='irt'?'('+y.f+')':''}`).join('، ');
    return `- ${x.date} ورودی ${fM(x.amountIRT)} → تصمیم واقعی: ${f}`;
  }).join('\n')||'(سابقه‌ای نیست)';
  const sugg=d.lines.map(l=>`- ${l.label}: ${fM(l.amount)}${l.form!=='irt'?' ('+l.form+')':''}`).join('\n');

  return `تو مشاور مالی شخصی من هستی. من در ایران زندگی می‌کنم، درآمدم پروژه‌ای و نامنظمه، و می‌خوام بدهی‌هام رو تسویه کنم و همزمان ارزش پولم رو حفظ کنم.

**قبل از پاسخ، وب‌سرچ کن** برای: قیمت و روند اخیر طلا جهانی (XAU/PAXG)، وضعیت دلار، و هر خبر مهم اقتصادی که روی تصمیم امروز اثر داره.

${debts}

**حساب‌های بانکی:**
${accs}

**دارایی‌های نگهداری‌شده:**
${holds}

**پس‌انداز سفر تا الان:** ${fM(S.travelSaved)}

**پیشنهاد فعلی سیستم قانون‌محور من:**

## چی می‌خوام

۱. تحلیل کوتاه از شرایط بازار امروز (بر اساس سرچت) — حداکثر ۳ خط

۳. برای هر بخشی که پیشنهاد می‌دی به بدهی تخصیص بدم اما فوراً پرداخت نشه: بگو ریال بمونه، طلا بشه، یا PAXG — و **چرا**
۴. یک ریسک یا نکته‌ای که ممکنه ندیده باشم

فارسی، صریح، با عدد. حداکثر ۳۰۰ کلمه. تعارف نکن — اگر فکر می‌کنی دارم اشتباه می‌کنم بگو.`;

function payDebt(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;closeM();
  setTimeout(()=>modal(`<div class="mh"></div><div class="mt">پرداخت — ${d.name}</div>
    <div class="f"><label>مبلغ (تومان)</label><input type="number" id="pd-a" placeholder="۰" inputmode="decimal" style="font-size:18px;text-align:center"></div>
    <div class="f"><label>از حساب</label><select id="pd-acc"><option value="">— بدون کسر از حساب —</option>${S.accounts.map(a=>`<option value="${a.id}">${a.name} (${fM(toIRT(a.balance,a.cur))})</option>`).join('')}</select></div>
    <div class="f"><label>تاریخ</label><input type="date" id="pd-d" value="${todayS()}"></div>
    <button class="btn btn-p" onclick="doPayDebt('${id}')">ثبت پرداخت</button>
    <button class="btn" onclick="closeM()">انصراف</button>`),60);
}
function doPayDebt(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  const a=parseFloat(document.getElementById('pd-a').value)||0;
  const accId=document.getElementById('pd-acc').value;
  const dt=document.getElementById('pd-d').value;
  if(!a){alert('مبلغ را وارد کنید');return}
  d.paid+=a;
  if(accId){const acc=S.accounts.find(x=>x.id===accId);if(acc)acc.balance-=acc.cur==='IRT'?a:toUSD(a,'IRT')}
  S.txs.push({id:'t'+Date.now(),date:dt,desc:'پرداخت '+d.name,amount:a,cur:'IRT',cat:'بدهی',type:'expense',acc:accId||null,debtId:id});
  save();closeM();render();toast('پرداخت ثبت شد ✓');
}
function releaseHold(hid){
  const h=S.holdings.find(x=>x.id===hid);if(!h)return;closeM();
  const val=holdingIRT(h);
  const dn={gold18:'طلا ۱۸ع',paxg:'PAXG',usd:'دلار',usdt:'تتر'}[h.kind]||h.kind;
  setTimeout(()=>modal(`<div class="mh"></div><div class="mt">آزادسازی — ${dn}</div>
    <div class="al w" style="margin-bottom:14px"><span>⚠️</span><div>ارزش فعلی: <strong>${fM(val)}</strong><br>با آزادسازی، مانده بدهی مربوطه دوباره افزایش می‌یابد.</div></div>
    <div class="f"><label>چه کاری؟</label><select id="rl-mode">
      <option value="free">فقط تخصیص را بردار (دارایی بماند)</option>
      <option value="sell">بفروش و به حساب واریز کن</option>
      <option value="pay">بفروش و همان بدهی را پرداخت کن</option>
    </select></div>
    <div class="f"><label>قیمت فروش (تومان) — اگر می‌فروشی</label><input type="number" id="rl-p" value="${Math.round(val)}" inputmode="decimal"></div>
    <div class="f"><label>واریز به حساب</label><select id="rl-acc">${S.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
    <div class="f"><label>دلیل (برای تاریخچه)</label><input id="rl-n" placeholder="مثلاً: فوریت پرداخت وندور"></div>
    <button class="btn btn-p" onclick="doRelease('${hid}')">تأیید</button>
    <button class="btn" onclick="closeM()">انصراف</button>`),60);
}
function doRelease(hid){
  const h=S.holdings.find(x=>x.id===hid);if(!h)return;
  const mode=document.getElementById('rl-mode').value;
  const price=parseFloat(document.getElementById('rl-p').value)||holdingIRT(h);
  const accId=document.getElementById('rl-acc').value;
  const note=document.getElementById('rl-n').value.trim();
  const debtName=h.allocTo?(S.debts.find(x=>x.id===h.allocTo)?.name||''):'';
  if(mode==='free'){ h.allocTo=null; h.note=(h.note||'')+' | آزاد شد'+(note?': '+note:''); }
  else if(mode==='sell'){
    const acc=S.accounts.find(a=>a.id===accId);
    if(acc)acc.balance+=acc.cur==='IRT'?price:toUSD(price,'IRT');
    S.holdings=S.holdings.filter(x=>x.id!==hid);
    S.txs.push({id:'t'+Date.now(),date:todayS(),desc:'فروش دارایی'+(debtName?' ('+debtName+')':'')+(note?' — '+note:''),amount:price,cur:'IRT',cat:'فروش دارایی',type:'income',acc:accId});
  } else if(mode==='pay'){
    const debt=S.debts.find(x=>x.id===h.allocTo);
    if(debt){debt.paid+=price;S.txs.push({id:'t'+Date.now(),date:todayS(),desc:'پرداخت '+debt.name+' از فروش دارایی',amount:price,cur:'IRT',cat:'بدهی',type:'expense',debtId:debt.id})}
    S.holdings=S.holdings.filter(x=>x.id!==hid);
  }
  S.decisions.push({id:'R'+Date.now(),date:todayS(),amountIRT:price,note:'آزادسازی '+(debtName||'')+': '+(note||mode),final:[]});
  save();closeM();render();toast('انجام شد ✓');
}

function viewKind(k){

    ${items.map(h=>{
      const al=h.allocTo?(S.debts.find(x=>x.id===h.allocTo)?.name||'—'):null;
      const cost=h.buyPriceIRT?h.qty*h.buyPriceIRT:0;
      const now=holdingIRT(h);

      return `<div class="alloc" style="flex-direction:column;align-items:stretch;gap:6px">
        <div style="display:flex;justify-content:space-between">

/*───────── MONTHLY COMMITMENTS ─────────*/
function rMonthly(){
  const jm=S.jMonth;
  const months=last12J().map(k=>`<div class="mc${jm===k?' active':''}" onclick="S.jMonth='${k}';save();render()">${fjm(k)}</div>`).join('');
  const total=monthlyCommitTotal();
  let paid=0;
  const rows=S.commits.map(c=>{
    const need=toIRT(c.amount,c.cur);
    const p=Math.min(need,commitPaidThisMonth(c.id,jm));
    paid+=p;
    const pct=need>0?Math.round(p/need*100):0;
    return `<div class="row" onclick="payCommit('${c.id}')">
      <div class="ico" style="background:${pct>=100?'var(--tealL)':c.kind==='saving'?'var(--blueL)':'var(--coralL)'}">${pct>=100?'✅':c.kind==='saving'?'✈️':'📌'}</div>
      <div class="inf">
        <div class="i-t">${c.name}</div>
        <div class="i-s">${fM(need)} ماهانه${c.kind==='saving'?' · <span class="bdg blue">پس‌انداز</span>':''}</div>
        <div class="pg"><div class="pgf" style="width:${Math.min(pct,100)}%;background:${pct>=100?'var(--teal)':'var(--amber)'}"></div></div>
      </div>
      <div class="rt"><div class="r-m ${pct>=100?'pos':''}">${fM(p)}</div><div class="r-s">${pct}%</div></div>
    </div>`;
  }).join('');
  const pct=total>0?Math.round(paid/total*100):0;
  return `<div class="sec">
    <div class="mrow">${months}</div>
    <div class="hero ${pct>=100?'teal':'purple'}">
      <div class="h-l">تعهدات ${fjm(jm)}</div>
      <div class="h-v">${pct}%</div>
      <div class="h-s">${fM(paid)} از ${fM(total)}</div>
    </div>
    ${rows}
    <button class="btn" onclick="addCommit()">+ افزودن تعهد ماهانه</button>
  </div>`;
}
function payCommit(id){
  const c=S.commits.find(x=>x.id===id);if(!c)return;
  const need=toIRT(c.amount,c.cur)-commitPaidThisMonth(c.id,S.jMonth);
  modal(`<div class="mh"></div><div class="mt">${c.name}</div>
    <div class="card" style="margin-bottom:12px">
      <div class="ir"><span style="color:var(--t3)">مبلغ ماهانه</span><span>${fM(toIRT(c.amount,c.cur))}</span></div>
      <div class="ir"><span style="color:var(--t3)">پرداخت‌شده ${fjm(S.jMonth)}</span><span style="color:var(--teal)">${fM(commitPaidThisMonth(c.id,S.jMonth))}</span></div>
      <div class="ir"><span style="color:var(--t3)">باقی‌مانده</span><span style="color:var(--coral);font-weight:600">${fM(Math.max(0,need))}</span></div>
    </div>
    <div class="f"><label>مبلغ پرداخت</label><input type="number" id="pc-a" value="${Math.max(0,Math.round(need))}" inputmode="decimal" style="font-size:18px;text-align:center"></div>
    <div class="f"><label>از حساب</label><select id="pc-acc"><option value="">— بدون کسر —</option>${S.accounts.map(a=>`<option value="${a.id}">${a.name}</option>`).join('')}</select></div>
    <button class="btn btn-p" onclick="doPayCommit('${id}')">ثبت پرداخت</button>
    <button class="btn" onclick="editCommit('${id}')">ویرایش تعهد</button>
    <button class="btn" onclick="closeM()">بستن</button>`);
}
function doPayCommit(id){
  const c=S.commits.find(x=>x.id===id);if(!c)return;
  const a=parseFloat(document.getElementById('pc-a').value)||0;
  const accId=document.getElementById('pc-acc').value;
  if(!a){alert('مبلغ را وارد کنید');return}
  const g=j2g(...S.jMonth.split('-').map(Number),15);
  const dt=`${g.gy}-${String(g.gm).padStart(2,'0')}-${String(g.gd).padStart(2,'0')}`;
  S.txs.push({id:'t'+Date.now(),date:dt,desc:c.name,amount:a,cur:'IRT',cat:'تعهد',type:'expense',acc:accId||null,commitId:id});
  if(accId){const acc=S.accounts.find(x=>x.id===accId);if(acc)acc.balance-=acc.cur==='IRT'?a:toUSD(a,'IRT')}
  if(c.kind==='saving')S.travelSaved+=a;
  save();closeM();render();toast('پرداخت ثبت شد ✓');
}
function addCommit(){
  modal(`<div class="mh"></div><div class="mt">افزودن تعهد ماهانه</div>
    <div class="f"><label>عنوان</label><input id="ac-n" placeholder="مثلاً: اجاره"></div>
    <div class="f"><label>مبلغ ماهانه (تومان)</label><input type="number" id="ac-a" inputmode="decimal"></div>
    <div class="f"><label>نوع</label><select id="ac-k"><option value="expense">هزینه</option><option value="saving">پس‌انداز</option></select></div>
    <button class="btn btn-p" onclick="doAddCommit()">ذخیره</button>
    <button class="btn" onclick="closeM()">انصراف</button>`);
}
function doAddCommit(){
  const n=document.getElementById('ac-n').value.trim();
  const a=parseFloat(document.getElementById('ac-a').value)||0;
  if(!n||!a){alert('عنوان و مبلغ الزامی است');return}
  S.commits.push({id:'c'+Date.now(),name:n,amount:a,cur:'IRT',kind:document.getElementById('ac-k').value});
  save();closeM();render();toast('تعهد اضافه شد ✓');
}
function editCommit(id){
  const c=S.commits.find(x=>x.id===id);if(!c)return;closeM();
  setTimeout(()=>modal(`<div class="mh"></div><div class="mt">ویرایش — ${c.name}</div>
    <div class="f"><label>عنوان</label><input id="ec-n" value="${c.name}"></div>
    <div class="f"><label>مبلغ ماهانه</label><input type="number" id="ec-a" value="${c.amount}" inputmode="decimal"></div>
    <button class="btn btn-p" onclick="doEditCommit('${id}')">ذخیره</button>
    <button class="btn btn-d" onclick="if(confirm('حذف؟')){S.commits=S.commits.filter(x=>x.id!=='${id}');save();closeM();render()}">حذف</button>
    <button class="btn" onclick="closeM()">انصراف</button>`),60);
}
function doEditCommit(id){
  const c=S.commits.find(x=>x.id===id);if(!c)return;
  c.name=document.getElementById('ec-n').value.trim()||c.name;
  c.amount=parseFloat(document.getElementById('ec-a').value)||c.amount;
  save();closeM();render();toast('ذخیره شد ✓');
}

function setKey(){
  modal(`<div class="mh"></div><div class="mt">کلید API</div>

    <button class="btn" onclick="closeM()">انصراف</button>`);
}
function editRate(w){
  const v=w==='usd'?S.usdIRT:S.eurIRT;
  modal(`<div class="mh"></div><div class="mt">${w==='usd'?'دلار آزاد':'یورو'} به تومان</div>
    <div class="f"><label>نرخ (تومان)</label><input type="number" id="ri" value="${v||''}" inputmode="decimal" placeholder="مثلاً ۱۵۲۸۰۰" style="font-size:20px;font-weight:600;text-align:center"></div>
    <button class="btn btn-p" onclick="doRate('${w}')">ذخیره</button>
    <button class="btn" onclick="closeM()">انصراف</button>`);
  setTimeout(()=>{const e=document.getElementById('ri');if(e){e.focus();e.select()}},110);
}
function doRate(w){
  const v=parseFloat(document.getElementById('ri').value)||0;
  if(v<1000){alert('نرخ نامعتبر');return}
  if(w==='usd')S.usdIRT=v;else S.eurIRT=v;
  save();closeM();render();syncTick();toast('نرخ ذخیره شد ✓');
}

  modal(`<div class="mh"></div><div class="mt">ضریب حباب طلا</div>

function expData(){
  const d={};['accounts','holdings','debts','commits','txs','allocLog','decisions','cats','usdIRT','eurIRT','goldPremium','travelSaved','prices'].forEach(k=>d[k]=S[k]);
  d.exported=new Date().toISOString();
  const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='finance-'+todayS()+'.json';a.click();
}
function impData(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
      ['accounts','holdings','debts','commits','txs','allocLog','decisions','cats','usdIRT','eurIRT','goldPremium','travelSaved','prices'].forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
      save();render();toast('بکاپ بارگذاری شد ✓');
    }catch{alert('فایل معتبر نیست')}};
    r.readAsText(f)};
  i.click();
}
function resetAll(){
  if(!confirm('همه داده‌ها پاک شوند؟ (بدهی‌ها و تعهدات به حالت اولیه برمی‌گردند)'))return;
  if(!confirm('مطمئنی؟ این عمل برگشت‌ناپذیره.'))return;
  S.accounts=BANKS.map((b,i)=>({id:'a'+(i+1),name:'بانک '+b,type:'bank',cur:'IRT',balance:0,forFlow:['مهر','رسالت','شهر'].includes(b)}));
  S.holdings=[];S.debts=JSON.parse(JSON.stringify(DEBTS0));S.commits=JSON.parse(JSON.stringify(COMMIT0));
  S.txs=[];S.allocLog=[];S.decisions=[];S.travelSaved=0;
  save();go('dashboard');toast('ریست شد');
}

/*═══════════════ UI UTILS ═══════════════*/
function toast(m){
  const o=document.getElementById('_t');if(o)o.remove();
  const t=document.createElement('div');t.id='_t';
  t.style.cssText='position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:999;padding:9px 18px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:var(--teal);color:#fff;box-shadow:0 2px 12px rgba(0,0,0,.2)';
  t.textContent=m;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2300);
}
function modal(h){document.getElementById('mc').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="mod">${h}</div></div>`}
function closeM(){document.getElementById('mc').innerHTML=''}
