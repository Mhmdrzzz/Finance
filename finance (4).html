<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دارایی من">
<title>دارایی من</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#fff;--bg1:#f5f5f3;--bg2:#ebebea;
--text1:#1a1a18;--text2:#555551;--text3:#888780;
--border:#e0dfd8;
--teal:#1D9E75;--teal-lt:#E1F5EE;--teal-dk:#085041;
--coral:#D85A30;--coral-lt:#FAECE7;--coral-dk:#4A1B0C;
--blue:#378ADD;--blue-lt:#E6F1FB;--blue-dk:#0C447C;
--amber:#BA7517;--amber-lt:#FAEEDA;--amber-dk:#633806;
--purple:#534AB7;--purple-lt:#EEEDFE;--purple-dk:#26215C;
--red:#E24B4A;--red-lt:#FCEBEB;--red-dk:#501313;
--green:#639922;--green-lt:#EAF3DE;--green-dk:#173404;
--r-md:8px;--r-lg:12px;--r-xl:16px;
}
@media(prefers-color-scheme:dark){:root{
--bg0:#1c1c1a;--bg1:#232320;--bg2:#2a2a27;
--text1:#f0efe8;--text2:#b4b2a9;--text3:#888780;
--border:#38382f;
--teal:#5DCAA5;--teal-lt:#04342C;--teal-dk:#9FE1CB;
--coral:#F0997B;--coral-lt:#4A1B0C;--coral-dk:#F5C4B3;
--blue:#85B7EB;--blue-lt:#042C53;--blue-dk:#B5D4F4;
--amber:#EF9F27;--amber-lt:#412402;--amber-dk:#FAC775;
--purple:#AFA9EC;--purple-lt:#26215C;--purple-dk:#CECBF6;
--red:#F09595;--red-lt:#501313;--red-dk:#F7C1C1;
--green:#97C459;--green-lt:#173404;--green-dk:#C0DD97;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--text1);font-size:15px;min-height:100vh;direction:rtl}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg0)}
.topbar{background:var(--bg0);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-size:17px;font-weight:500}
.topbar-sub{font-size:12px;color:var(--text3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding-bottom:90px}
.navbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg0);border-top:0.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 4px;cursor:pointer;gap:3px}
.nav-icon{width:22px;height:22px;display:flex;align-items:center;justify-content:center}
.nav-label{font-size:10px;color:var(--text3)}
.nav-item.active .nav-label{color:var(--teal);font-weight:500}
.section{padding:16px}
.card{background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{border-radius:var(--r-md);padding:12px;background:var(--bg1)}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.metric-value{font-size:19px;font-weight:500}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px}
.metric.teal{background:var(--teal-lt)}.metric.teal .metric-value{color:var(--teal-dk)}
.metric.coral{background:var(--coral-lt)}.metric.coral .metric-value{color:var(--coral)}
.metric.blue{background:var(--blue-lt)}.metric.blue .metric-value{color:var(--blue)}
.metric.purple{background:var(--purple-lt)}.metric.purple .metric-value{color:var(--purple)}
.metric.red{background:var(--red-lt)}.metric.red .metric-value{color:var(--red)}
.metric.green{background:var(--green-lt)}.metric.green .metric-value{color:var(--green)}
.hero{border-radius:var(--r-xl);padding:20px;margin-bottom:12px;text-align:center}
.hero.teal{background:var(--teal-lt);border:0.5px solid var(--teal)}
.hero.purple{background:var(--purple-lt);border:0.5px solid var(--purple)}
.hero.red{background:var(--red-lt);border:0.5px solid var(--red)}
.hero-label{font-size:12px;margin-bottom:4px}
.hero.teal .hero-label{color:var(--teal-dk)}.hero.teal .hero-value{color:var(--teal-dk)}.hero.teal .hero-sub{color:var(--teal)}
.hero.purple .hero-label{color:var(--purple)}.hero.purple .hero-value{color:var(--purple)}.hero.purple .hero-sub{color:var(--purple)}
.hero.red .hero-label{color:var(--red-dk)}.hero.red .hero-value{color:var(--red)}.hero.red .hero-sub{color:var(--red)}
.hero-value{font-size:30px;font-weight:500}
.hero-sub{font-size:13px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-md);border:0.5px solid var(--border);background:var(--bg0);color:var(--text1);font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-sm{padding:5px 12px;font-size:12px;width:auto;margin-bottom:0}
.btn-fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;background:var(--teal);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(29,158,117,.35);z-index:99}
.btn-fab:active{transform:scale(.94)}
.ticker{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;border-bottom:0.5px solid var(--border);scrollbar-width:none;background:var(--bg0)}
.ticker::-webkit-scrollbar{display:none}
.ticker-chip{flex-shrink:0;background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--r-md);padding:6px 10px;min-width:76px}
.ticker-name{font-size:10px;color:var(--text3);font-weight:500;margin-bottom:2px}
.ticker-price{font-size:12px;font-weight:500}
.ticker-chg{font-size:10px}
.up{color:var(--teal)}.dn{color:var(--coral)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:blink 1s infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.spinning{display:inline-block;animation:spin .7s linear infinite}
.tx-item,.debt-item,.inv-item-row{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px}
.item-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:var(--text3);margin-top:2px}
.item-right{text-align:left;flex-shrink:0}
.item-main{font-size:15px;font-weight:500}
.item-sec{font-size:11px;color:var(--text3)}
.positive{color:var(--teal)}.negative{color:var(--coral)}
.sec-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:10px;letter-spacing:.3px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg0);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:500;margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text3);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text1);font-size:16px;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--teal);outline-offset:-1px}
.seg{display:flex;background:var(--bg1);border-radius:var(--r-md);padding:3px;gap:2px;margin-bottom:14px}
.seg-opt{flex:1;padding:8px 4px;text-align:center;border-radius:calc(var(--r-md) - 2px);font-size:12px;cursor:pointer;color:var(--text2)}
.seg-opt.active{background:var(--bg0);color:var(--text1);font-weight:500;border:0.5px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar-label{font-size:12px;color:var(--text2);width:72px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:8px;background:var(--bg1);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:12px;color:var(--text2);width:60px;text-align:left;flex-shrink:0}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.hint{background:var(--blue-lt);border:0.5px solid var(--blue);border-radius:var(--r-md);padding:13px;margin-bottom:12px;font-size:13px;color:var(--blue-dk);display:flex;align-items:flex-start;gap:10px;line-height:1.6}
.empty-state{text-align:center;padding:40px 24px;color:var(--text3)}
.day-label{font-size:11px;color:var(--text3);margin:12px 0 6px;font-weight:500}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three-col{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
/* P&L badge */
.pnl-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:var(--r-md);font-size:12px;font-weight:500}
.pnl-badge.profit{background:var(--green-lt);color:var(--green-dk)}
.pnl-badge.loss{background:var(--red-lt);color:var(--red-dk)}
/* progress bar for debt */
.progress-track{height:6px;background:var(--bg1);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;background:var(--teal)}
/* category tag */
.cat-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;background:var(--bg1);border:0.5px solid var(--border);margin:3px}
.cat-tag-del{cursor:pointer;color:var(--text3);font-size:14px;line-height:1}
.cat-tag-del:hover{color:var(--coral)}
.rate-edit-btn{padding:5px 10px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg0);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit}
.alert-banner{border-radius:var(--r-md);padding:10px 13px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:8px}
.alert-banner.warn{background:var(--amber-lt);border:0.5px solid var(--amber);color:var(--amber-dk)}
.alert-banner.danger{background:var(--red-lt);border:0.5px solid var(--red);color:var(--red-dk)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="page-title">داشبورد</div>
      <div class="topbar-sub" id="page-sub"></div>
    </div>
    <button onclick="showPage('settings')" style="padding:6px 12px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit">تنظیمات</button>
  </div>
  <div class="ticker" id="ticker">
    <div class="ticker-chip" id="chip-BTC"><div class="ticker-name">BTC</div><div class="ticker-price pulse">...</div><div class="ticker-chg">—</div></div>
    <div class="ticker-chip" id="chip-ETH"><div class="ticker-name">ETH</div><div class="ticker-price pulse">...</div><div class="ticker-chg">—</div></div>
    <div class="ticker-chip" id="chip-PAXG"><div class="ticker-name">PAXG</div><div class="ticker-price pulse">...</div><div class="ticker-chg">—</div></div>
    <div class="ticker-chip" id="chip-USD" onclick="editRate('usd')" style="cursor:pointer"><div class="ticker-name">USD/IRT</div><div class="ticker-price" id="chip-usd-val">—</div><div class="ticker-chg" style="color:var(--amber)">دستی ✎</div></div>
    <div class="ticker-chip" id="chip-EUR" onclick="editRate('eur')" style="cursor:pointer"><div class="ticker-name">EUR/IRT</div><div class="ticker-price" id="chip-eur-val">—</div><div class="ticker-chg" style="color:var(--amber)">دستی ✎</div></div>
  </div>
  <div class="content" id="content"></div>
  <button class="btn-fab" id="fab" onclick="fabAction()">+</button>
  <nav class="navbar">
    <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="13" y="3" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="3" y="13" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="13" y="13" width="8" height="8" rx="2" fill="var(--text3)"/></svg></div>
      <div class="nav-label">داشبورد</div>
    </div>
    <div class="nav-item" onclick="showPage('transactions')" id="nav-transactions">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/><path d="M9 12h6M9 16h4" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg></div>
      <div class="nav-label">تراکنش‌ها</div>
    </div>
    <div class="nav-item" onclick="showPage('debts')" id="nav-debts">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="var(--text3)"/></svg></div>
      <div class="nav-label">بدهی‌ها</div>
    </div>
    <div class="nav-item" onclick="showPage('investments')" id="nav-investments">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17l4-4 4 4 4-6 4 2" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="nav-label">سرمایه</div>
    </div>
    <div class="nav-item" onclick="showPage('settings')" id="nav-settings">
      <div class="nav-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="var(--text3)" stroke-width="1.5"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="var(--text3)" stroke-width="1.5"/></svg></div>
      <div class="nav-label">تنظیمات</div>
    </div>
  </nav>
</div>
<div id="modal-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── storage ───────────────────────────────────────────────────
function db(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem('pf_'+k)||'null')}catch{return null}}try{localStorage.setItem('pf_'+k,JSON.stringify(v))}catch{}}

// ── default categories ────────────────────────────────────────
const DEF_CATS = {
  expense:['خوراک','حمل‌ونقل','مسکن','سلامت','پوشاک','تفریح','آموزش','قبوض','سایر'],
  income:['حقوق','فریلنس','سود سرمایه','هدیه','سایر'],
  investment:['بیت‌کوین','اتریوم','PAXG','طلا','سهام','صندوق','ملک','سایر'],
  debt:['وام بانکی','قسط خودرو','قسط مسکن','بدهی شخصی','کارت اعتباری','سایر'],
};

// ── state ─────────────────────────────────────────────────────
let S = {
  txs:         db('txs')         || [],
  accounts:    db('accounts')    || [
    {id:'a1',name:'کیف پول نقد', type:'cash',  currency:'IRT', balance:50000000},
    {id:'a2',name:'بانک ملی',    type:'bank',  currency:'IRT', balance:200000000},
    {id:'a3',name:'حساب دلاری',  type:'bank',  currency:'USD', balance:500},
  ],
  investments: db('investments') || [
    {id:'i1',name:'بیت‌کوین',  type:'بیت‌کوین', qty:0.05, buyPrice:60000,   currency:'USD'},
    {id:'i2',name:'طلا مثقال', type:'طلا',       qty:3,    buyPrice:5000000, currency:'IRT'},
  ],
  debts: db('debts') || [],
  cats: db('cats') || {
    expense:[...DEF_CATS.expense],
    income:[...DEF_CATS.income],
    investment:[...DEF_CATS.investment],
    debt:[...DEF_CATS.debt],
  },
  usdIRT:  db('usdIRT')  || 62000,
  eurIRT:  db('eurIRT')  || 68000,
  prices:  db('prices')  || {BTC:0,ETH:0,PAXG:0},
  priceAt: db('priceAt') || null,
  fetchingPrices: false,
  page:  'dashboard',
  month: new Date().toISOString().slice(0,7),
  chart: null,
};
function save(){
  db('txs',S.txs); db('accounts',S.accounts); db('investments',S.investments);
  db('debts',S.debts); db('cats',S.cats);
  db('usdIRT',S.usdIRT); db('eurIRT',S.eurIRT);
  db('prices',S.prices); db('priceAt',S.priceAt);
}

// ── currency helpers ──────────────────────────────────────────
function toUSD(amt,cur){
  if(cur==='USD'||cur==='USDT') return amt;
  if(cur==='EUR')  return amt*(S.usdIRT/Math.max(S.eurIRT,1));
  if(cur==='IRT')  return amt/Math.max(S.usdIRT,1);
  if(cur==='BTC')  return amt*Math.max(S.prices.BTC,1);
  if(cur==='ETH')  return amt*Math.max(S.prices.ETH,1);
  if(cur==='PAXG') return amt*Math.max(S.prices.PAXG,1);
  return amt/Math.max(S.usdIRT,1);
}
function toIRT(amt,cur){
  if(cur==='IRT')  return amt;
  if(cur==='EUR')  return amt*S.eurIRT;
  if(cur==='BTC')  return amt*S.prices.BTC*S.usdIRT;
  if(cur==='ETH')  return amt*S.prices.ETH*S.usdIRT;
  if(cur==='PAXG') return amt*S.prices.PAXG*S.usdIRT;
  return amt*S.usdIRT;
}
function fmtT(n){return Math.round(n).toLocaleString('fa-IR')}
function fmtU(n){return '$'+parseFloat(n).toFixed(2)}
function fmtUS(n){if(n>=1000)return '$'+Math.round(n).toLocaleString('en-US');return '$'+parseFloat(n).toFixed(2)}
function today(){return new Date().toISOString().split('T')[0]}
function ago(iso){if(!iso)return'هرگز';const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(s<60)return'همین الان';if(s<3600)return Math.floor(s/60)+' دقیقه پیش';if(s<86400)return Math.floor(s/3600)+' ساعت پیش';return Math.floor(s/86400)+' روز پیش';}
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

// ── icons ─────────────────────────────────────────────────────
const ICONS={خوراک:'🍽',حمل‌ونقل:'🚗',مسکن:'🏠',سلامت:'💊',پوشاک:'👕',تفریح:'🎮',آموزش:'📚',قبوض:'💡',حقوق:'💼',فریلنس:'💻','سود سرمایه':'📈',هدیه:'🎁','بیت‌کوین':'₿',اتریوم:'⟠',PAXG:'🥇',طلا:'🥇',سهام:'📊',صندوق:'🏦',ملک:'🏗','وام بانکی':'🏦','قسط خودرو':'🚗','قسط مسکن':'🏠','بدهی شخصی':'🤝','کارت اعتباری':'💳',expense:'💸',income:'💰',investment:'📈',debt:'💰',default:'💳'};

// ── Binance ───────────────────────────────────────────────────
async function fetchPrices(){
  if(S.fetchingPrices)return;
  S.fetchingPrices=true;
  try{
    const url='https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","PAXGUSDT"]';
    const res=await Promise.race([fetch(url),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),8000))]);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const map={};data.forEach(d=>{map[d.symbol]={price:parseFloat(d.lastPrice),chg:parseFloat(d.priceChangePercent)}});
    if(map.BTCUSDT) S.prices.BTC=map.BTCUSDT.price;
    if(map.ETHUSDT) S.prices.ETH=map.ETHUSDT.price;
    if(map.PAXGUSDT)S.prices.PAXG=map.PAXGUSDT.price;
    S.priceAt=new Date().toISOString();
    save();
    updateTicker(map);
    if(['dashboard','investments'].includes(S.page))render();
  }catch(e){
    ['BTC','ETH','PAXG'].forEach(s=>{const p=document.querySelector(`#chip-${s} .ticker-price`);if(p){p.classList.remove('pulse');if(S.prices[s]>0)p.textContent=fmtUS(S.prices[s]);}});
  }
  S.fetchingPrices=false;
}
function updateTicker(map){
  const pairs={BTC:'BTCUSDT',ETH:'ETHUSDT',PAXG:'PAXGUSDT'};
  Object.entries(pairs).forEach(([sym,key])=>{
    const chip=document.getElementById('chip-'+sym);if(!chip)return;
    const d=map[key];if(!d)return;
    const pe=chip.querySelector('.ticker-price');const ce=chip.querySelector('.ticker-chg');
    pe.classList.remove('pulse');pe.textContent=fmtUS(d.price);
    ce.textContent=(d.chg>=0?'+':'')+d.chg.toFixed(2)+'%';
    ce.className='ticker-chg '+(d.chg>=0?'up':'dn');
  });
  updateManualChips();
}
function updateManualChips(){
  const u=document.getElementById('chip-usd-val');const e=document.getElementById('chip-eur-val');
  if(u)u.textContent=fmtT(S.usdIRT);if(e)e.textContent=fmtT(S.eurIRT);
}

// ── nav ───────────────────────────────────────────────────────
function showPage(page){
  S.page=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('nav-'+page)?.classList.add('active');
  const showFab=['dashboard','transactions','debts','investments'].includes(page);
  document.getElementById('fab').style.display=showFab?'flex':'none';
  if(S.chart){S.chart.destroy();S.chart=null;}
  render();
}
function fabAction(){
  if(S.page==='transactions')openAddTx();
  else if(S.page==='debts')openAddDebt();
  else if(S.page==='investments')openAddInv();
  else openAddTx();
}

// ── render ────────────────────────────────────────────────────
function render(){
  const c=document.getElementById('content');
  const titles={dashboard:'داشبورد',transactions:'تراکنش‌ها',debts:'بدهی‌ها و اقساط',investments:'سرمایه‌گذاری‌ها',settings:'تنظیمات'};
  document.getElementById('page-title').textContent=titles[S.page]||'';
  const [yr,mo]=S.month.split('-');
  document.getElementById('page-sub').textContent=S.page==='dashboard'?MONTHS[+mo-1]+' '+yr:S.page==='transactions'?S.txs.length+' مورد':'';
  updateManualChips();
  if(S.page==='dashboard')     {c.innerHTML=rDash();drawChart();}
  else if(S.page==='transactions'){c.innerHTML=rTxs();}
  else if(S.page==='debts')       {c.innerHTML=rDebts();}
  else if(S.page==='investments') {c.innerHTML=rInvs();}
  else if(S.page==='settings')    {c.innerHTML=rSettings();}
}

// ── calcs ─────────────────────────────────────────────────────
function monthMetrics(m){
  let inc=0,exp=0;
  S.txs.filter(t=>t.date.startsWith(m)).forEach(t=>{const u=toUSD(t.amount,t.currency);if(t.type==='income')inc+=u;else if(t.type==='expense')exp+=u;});
  return{inc,exp,net:inc-exp,sav:inc>0?(inc-exp)/inc:0};
}
function netWorth(){
  let cash=0,inv=0,debt=0;
  S.accounts.forEach(a=>{
    let bal=a.balance;
    S.txs.forEach(t=>{const isIRT=a.currency==='IRT';const conv=isIRT?toIRT(t.amount,t.currency):toUSD(t.amount,t.currency);if(t.accountTo===a.id)bal+=conv;if(t.accountFrom===a.id)bal-=conv;});
    cash+=toUSD(bal,a.currency);
  });
  S.investments.forEach(i=>{
    const cur=i.currency;
    // use live price if available
    const liveMap={'بیت‌کوین':'BTC','اتریوم':'ETH','PAXG':'PAXG'};
    const sym=liveMap[i.type]||liveMap[i.name];
    const priceUSD=sym&&S.prices[sym]>0?S.prices[sym]:(cur==='USD'?i.currentPrice||i.buyPrice:toUSD(i.currentPrice||i.buyPrice,cur));
    inv+=i.qty*priceUSD;
  });
  S.debts.forEach(d=>{debt+=toUSD(d.remaining,d.currency);});
  return{cash,inv,debt,total:cash+inv-debt};
}
function invPnL(i){
  const liveMap={'بیت‌کوین':'BTC','اتریوم':'ETH','PAXG':'PAXG'};
  const sym=liveMap[i.type]||liveMap[i.name];
  let currentPriceUSD;
  if(sym&&S.prices[sym]>0){
    currentPriceUSD=S.prices[sym];
  } else {
    currentPriceUSD=toUSD(i.currentPrice||i.buyPrice, i.currency);
  }
  const buyPriceUSD=toUSD(i.buyPrice, i.currency);
  const costBasis=i.qty*buyPriceUSD;
  const currentVal=i.qty*currentPriceUSD;
  const pnlUSD=currentVal-costBasis;
  const pnlPct=costBasis>0?(pnlUSD/costBasis)*100:0;
  return{currentVal,costBasis,pnlUSD,pnlPct,currentPriceUSD};
}

// ── dashboard ─────────────────────────────────────────────────
function rDash(){
  const m=monthMetrics(S.month);const nw=netWorth();
  const savPct=Math.round(m.sav*100);
  const opts=MONTHS.map((n,i)=>{const v=S.month.split('-')[0]+'-'+String(i+1).padStart(2,'0');return`<option value="${v}"${S.month===v?' selected':''}>${n}</option>`}).join('');
  // upcoming debt alerts
  const upcoming=S.debts.filter(d=>{
    if(!d.nextDate||d.remaining<=0)return false;
    const diff=(new Date(d.nextDate)-new Date())/86400000;
    return diff<=7&&diff>=0;
  });
  const alerts=upcoming.map(d=>`<div class="alert-banner warn">⏰ قسط <strong>${d.name}</strong> — ${fmtT(d.installment)} تومان — ${d.nextDate}</div>`).join('');
  const catT={};
  S.txs.filter(t=>t.date.startsWith(S.month)&&t.type==='expense').forEach(t=>{catT[t.category]=(catT[t.category]||0)+toUSD(t.amount,t.currency)});
  const sorted=Object.entries(catT).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxC=sorted[0]?.[1]||1;
  const bars=sorted.length?sorted.map(([cat,v])=>`<div class="bar-row"><div class="bar-label">${cat}</div><div class="bar-track"><div class="bar-fill" style="width:${(v/maxC*100).toFixed(0)}%;background:var(--coral)"></div></div><div class="bar-val">${fmtU(v)}</div></div>`).join(''):`<div style="color:var(--text3);font-size:13px;text-align:center;padding:16px">هنوز هزینه‌ای ثبت نشده</div>`;
  const totalDebtUSD=S.debts.reduce((s,d)=>s+toUSD(d.remaining,d.currency),0);
  return`<div class="section">
    ${alerts}
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:12px;color:var(--text3);flex-shrink:0">ماه:</span>
      <select onchange="S.month=this.value;render()" style="flex:1;padding:7px 10px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text1);font-size:13px;font-family:inherit">${opts}</select>
    </div>
    <div class="hero teal">
      <div class="hero-label">ارزش خالص کل (دارایی − بدهی)</div>
      <div class="hero-value">${fmtU(nw.total)}</div>
      <div class="hero-sub">≈ ${fmtT(nw.total*S.usdIRT)} تومان</div>
    </div>
    <div class="metric-grid">
      <div class="metric teal"><div class="metric-label">درآمد ماه</div><div class="metric-value">${fmtU(m.inc)}</div><div class="metric-sub">${fmtT(m.inc*S.usdIRT)} ت</div></div>
      <div class="metric coral"><div class="metric-label">هزینه ماه</div><div class="metric-value">${fmtU(m.exp)}</div><div class="metric-sub">${fmtT(m.exp*S.usdIRT)} ت</div></div>
      <div class="metric blue"><div class="metric-label">خالص ماه</div><div class="metric-value ${m.net>=0?'positive':'negative'}">${fmtU(m.net)}</div><div class="metric-sub">${m.net>=0?'مثبت ✓':'منفی !'}</div></div>
      <div class="metric purple"><div class="metric-label">پس‌انداز</div><div class="metric-value">${savPct}%</div><div class="metric-sub">${savPct>20?'عالی':savPct>10?'خوب':'نیاز بهبود'}</div></div>
    </div>
    <div class="metric-grid">
      <div class="metric green"><div class="metric-label">نقدینگی</div><div class="metric-value">${fmtU(nw.cash)}</div><div class="metric-sub">${fmtT(nw.cash*S.usdIRT)} ت</div></div>
      <div class="metric purple"><div class="metric-label">سرمایه</div><div class="metric-value">${fmtU(nw.inv)}</div><div class="metric-sub">${fmtT(nw.inv*S.usdIRT)} ت</div></div>
    </div>
    ${totalDebtUSD>0?`<div class="metric red" style="margin-bottom:12px"><div class="metric-label">مجموع بدهی</div><div class="metric-value">${fmtU(totalDebtUSD)}</div><div class="metric-sub">${fmtT(totalDebtUSD*S.usdIRT)} تومان</div></div>`:''}
    <div class="card"><div class="sec-title">هزینه بر اساس دسته</div>${bars}</div>
    <div class="card"><div class="sec-title">روند ۶ ماهه (دلار)</div><div style="position:relative;height:160px"><canvas id="trend-chart"></canvas></div></div>
  </div>`;
}
function drawChart(){
  const canvas=document.getElementById('trend-chart');
  if(!canvas||!window.Chart)return;
  const labels=[],incArr=[],expArr=[];
  for(let i=5;i>=0;i--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-i);const m=d.toISOString().slice(0,7);const mt=monthMetrics(m);labels.push(MONTHS[+m.split('-')[1]-1]);incArr.push(+mt.inc.toFixed(2));expArr.push(+mt.exp.toFixed(2));}
  const dark=window.matchMedia('(prefers-color-scheme:dark)').matches;
  const tc=dark?'#888780':'#888780';const gc=dark?'#2a2a27':'#f5f5f3';
  if(S.chart)S.chart.destroy();
  S.chart=new Chart(canvas,{type:'bar',data:{labels,datasets:[
    {label:'درآمد',data:incArr,backgroundColor:'rgba(29,158,117,0.75)',borderRadius:4,borderSkipped:false},
    {label:'هزینه',data:expArr,backgroundColor:'rgba(216,90,48,0.75)',borderRadius:4,borderSkipped:false},
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:11},boxWidth:12}}},scales:{x:{ticks:{color:tc,font:{size:11}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:11},callback:v=>'$'+v},grid:{color:gc}}}}});
}

// ── transactions ──────────────────────────────────────────────
function rTxs(){
  if(!S.txs.length)return`<div class="section"><div class="empty-state"><div style="font-size:40px;margin-bottom:12px">📋</div><div style="font-size:15px;font-weight:500;margin-bottom:6px">هنوز تراکنشی نیست</div><div style="font-size:13px">روی + بزنید</div></div></div>`;
  const sorted=[...S.txs].sort((a,b)=>b.date.localeCompare(a.date));
  const byDay={};sorted.forEach(t=>{if(!byDay[t.date])byDay[t.date]=[];byDay[t.date].push(t)});
  return`<div class="section">${Object.entries(byDay).map(([date,txs])=>`<div class="day-label">${date}</div>${txs.map(t=>{
    const icon=ICONS[t.category]||ICONS[t.type]||ICONS.default;
    const sign=t.type==='expense'?'-':'+';const cls=t.type==='expense'?'negative':'positive';
    const usd=toUSD(t.amount,t.currency);const irt=toIRT(t.amount,t.currency);
    const main=t.currency==='IRT'?fmtT(t.amount)+' ت':fmtU(usd);
    const sub=t.currency==='IRT'?fmtU(usd):fmtT(irt)+' ت';
    const bg=t.type==='expense'?'var(--coral-lt)':t.type==='income'?'var(--teal-lt)':'var(--purple-lt)';
    return`<div class="tx-item" onclick="editTx('${t.id}')"><div class="item-icon" style="background:${bg}">${icon}</div><div class="item-info"><div class="item-title">${t.desc}</div><div class="item-sub">${t.category}${t.account?' · '+t.account:''}</div></div><div class="item-right"><div class="item-main ${cls}">${sign}${main}</div><div class="item-sec">${sub}</div></div></div>`;
  }).join('')}`).join('')}</div>`;
}

// ── debts ─────────────────────────────────────────────────────
function rDebts(){
  const iOwe=S.debts.filter(d=>d.direction==='owe');
  const owedToMe=S.debts.filter(d=>d.direction==='owed');
  const totalOwe=iOwe.reduce((s,d)=>s+toUSD(d.remaining,d.currency),0);
  const totalOwed=owedToMe.reduce((s,d)=>s+toUSD(d.remaining,d.currency),0);

  function debtCard(d){
    const pct=d.total>0?Math.round((1-d.remaining/d.total)*100):0;
    const daysLeft=d.nextDate?Math.round((new Date(d.nextDate)-new Date())/86400000):null;
    const urgent=daysLeft!==null&&daysLeft<=7&&daysLeft>=0;
    const icon=ICONS[d.category]||'💰';
    return`<div class="debt-item" onclick="editDebt('${d.id}')" style="${urgent?'border-color:var(--amber)':''}">
      <div class="item-icon" style="background:${d.direction==='owe'?'var(--red-lt)':'var(--teal-lt)'}">${icon}</div>
      <div class="item-info">
        <div class="item-title">${d.name}</div>
        <div class="item-sub">${d.category}${d.counterpart?' · '+d.counterpart:''}</div>
        ${d.nextDate?`<div style="font-size:11px;color:${urgent?'var(--amber)':'var(--text3)'};margin-top:2px">${urgent?'⏰ ':''} سررسید: ${d.nextDate}${daysLeft!==null?' ('+daysLeft+' روز)':''}</div>`:''}
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="item-right">
        <div class="item-main ${d.direction==='owe'?'negative':'positive'}">${d.currency==='IRT'?fmtT(d.remaining)+' ت':fmtU(toUSD(d.remaining,d.currency))}</div>
        <div class="item-sec">${pct}% پرداخت شده</div>
      </div>
    </div>`;
  }

  return`<div class="section">
    <div class="two-col" style="margin-bottom:12px">
      <div class="metric red"><div class="metric-label">بدهی من</div><div class="metric-value">${fmtU(totalOwe)}</div><div class="metric-sub">${fmtT(totalOwe*S.usdIRT)} ت</div></div>
      <div class="metric teal"><div class="metric-label">طلب من</div><div class="metric-value">${fmtU(totalOwed)}</div><div class="metric-sub">${fmtT(totalOwed*S.usdIRT)} ت</div></div>
    </div>
    ${iOwe.length?`<div class="sec-title">بدهی‌های من</div>${iOwe.map(debtCard).join('')}`:''}
    ${owedToMe.length?`<div class="sec-title" style="margin-top:${iOwe.length?12:0}px">طلب‌های من</div>${owedToMe.map(debtCard).join('')}`:''}
    ${!S.debts.length?`<div class="empty-state"><div style="font-size:40px;margin-bottom:12px">✅</div><div style="font-size:15px;font-weight:500;margin-bottom:6px">بدهی یا قسطی ثبت نشده</div><div style="font-size:13px">روی + بزنید</div></div>`:''}
    <button class="btn" onclick="openAddDebt()">+ افزودن بدهی / قسط</button>
  </div>`;
}

// ── investments ───────────────────────────────────────────────
function rInvs(){
  let totalVal=0,totalCost=0;
  const rows=S.investments.map(i=>{const p=invPnL(i);totalVal+=p.currentVal;totalCost+=p.costBasis;return{i,p}});
  const totalPnL=totalVal-totalCost;
  const totalPnLPct=totalCost>0?(totalPnL/totalCost)*100:0;

  return`<div class="section">
    <div class="hero purple">
      <div class="hero-label">ارزش کل سرمایه‌گذاری</div>
      <div class="hero-value">${fmtU(totalVal)}</div>
      <div class="hero-sub">≈ ${fmtT(totalVal*S.usdIRT)} تومان</div>
    </div>
    <div class="two-col" style="margin-bottom:12px">
      <div class="metric ${totalPnL>=0?'green':'red'}">
        <div class="metric-label">سود / ضرر کل</div>
        <div class="metric-value">${totalPnL>=0?'+':''}${fmtU(totalPnL)}</div>
        <div class="metric-sub">${totalPnLPct>=0?'+':''}${totalPnLPct.toFixed(2)}%</div>
      </div>
      <div class="metric blue">
        <div class="metric-label">ارزش خرید</div>
        <div class="metric-value">${fmtU(totalCost)}</div>
        <div class="metric-sub">کل هزینه</div>
      </div>
    </div>
    ${rows.map(({i,p})=>{
      const sym={'بیت‌کوین':'BTC','اتریوم':'ETH','PAXG':'PAXG'}[i.type||i.name];
      const liveTag=sym&&S.prices[sym]>0?`<span style="font-size:10px;color:var(--teal)">● ${fmtUS(S.prices[sym])}</span>`:'';
      const pnlCls=p.pnlPct>=0?'profit':'loss';
      const share=totalVal>0?(p.currentVal/totalVal*100).toFixed(1):0;
      return`<div class="inv-item-row" onclick="editInv('${i.id}')">
        <div class="item-icon" style="background:var(--purple-lt)">${ICONS[i.type]||'📊'}</div>
        <div class="item-info">
          <div style="display:flex;align-items:center;gap:6px"><div class="item-title">${i.name}</div>${liveTag}</div>
          <div class="item-sub">${i.qty} واحد · خرید ${i.currency==='IRT'?fmtT(i.buyPrice)+' ت':fmtUS(i.buyPrice)}</div>
          <div style="margin-top:4px"><span class="pnl-badge ${pnlCls}">${p.pnlPct>=0?'+':''}${p.pnlPct.toFixed(2)}% &nbsp; ${p.pnlUSD>=0?'+':''}${fmtU(p.pnlUSD)}</span></div>
        </div>
        <div class="item-right">
          <div class="item-main ${p.pnlPct>=0?'positive':'negative'}">${fmtU(p.currentVal)}</div>
          <div class="item-sec">${share}% پرتفو</div>
        </div>
      </div>`;
    }).join('')}
    <button class="btn" onclick="openAddInv()">+ افزودن سرمایه‌گذاری</button>
  </div>`;
}

function editDebt(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  const paid=d.total-d.remaining;
  modal(`<div class="modal-handle"></div><div class="modal-title">${d.name}</div>
    <div class="card" style="margin-bottom:16px">
      <div class="info-row"><span style="color:var(--text3)">طرف مقابل</span><span>${d.counterpart||'—'}</span></div>

      <div class="info-row"><span style="color:var(--text3)">مانده</span><span style="color:var(--coral);font-weight:500">${d.currency==='IRT'?fmtT(d.remaining)+' ت':fmtU(toUSD(d.remaining,d.currency))}</span></div>
      ${d.installment?`<div class="info-row"><span style="color:var(--text3)">قسط</span><span>${d.currency==='IRT'?fmtT(d.installment)+' ت':fmtU(toUSD(d.installment,d.currency))}</span></div>`:''}
      ${d.nextDate?`<div class="info-row"><span style="color:var(--text3)">سررسید بعدی</span><span>${d.nextDate}</span></div>`:''}
    </div>

    <button class="btn" onclick="editDebtFull('${id}')">ویرایش</button>

function payInstallment(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  const amt=d.installment||0;
  const newRem=Math.max(0,d.remaining-amt);
  // advance next date by ~30 days
  let newNext=d.nextDate;
  if(d.nextDate){const nd=new Date(d.nextDate);nd.setMonth(nd.getMonth()+1);newNext=nd.toISOString().split('T')[0];}
  d.remaining=newRem;d.nextDate=newNext;
  // log as transaction
  if(amt>0){
    S.txs.push({id:'tx'+Date.now(),date:today(),desc:'قسط: '+d.name,amount:amt,currency:d.currency,category:d.category,type:'expense',account:''});
  }
  save();closeModal();render();toast('قسط ثبت شد ✓','ok');
}
function editDebtFull(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;

// ── data ──────────────────────────────────────────────────────
function exportData(){
  const d={txs:S.txs,accounts:S.accounts,investments:S.investments,debts:S.debts,cats:S.cats,usdIRT:S.usdIRT,eurIRT:S.eurIRT,prices:S.prices,exported:new Date().toISOString()};
  const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='finance-backup-'+today()+'.json';a.click();
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);
    if(d.txs)S.txs=d.txs;if(d.accounts)S.accounts=d.accounts;if(d.investments)S.investments=d.investments;
    if(d.debts)S.debts=d.debts;if(d.cats)S.cats=d.cats;
    if(d.usdIRT)S.usdIRT=d.usdIRT;if(d.eurIRT)S.eurIRT=d.eurIRT;if(d.prices)S.prices=d.prices;
    save();render();toast('بکاپ بارگذاری شد ✓','ok')}catch{alert('فایل معتبر نیست')}};r.readAsText(f)};inp.click();
}
function clearAll(){if(!confirm('همه تراکنش‌ها پاک شوند؟'))return;S.txs=[];save();render();toast('پاک شد','ok');}

// ── utils ─────────────────────────────────────────────────────
function toast(msg,type='ok'){
  const old=document.getElementById('_t');if(old)old.remove();
  const t=document.createElement('div');t.id='_t';
  t.style.cssText=`position:fixed;top:68px;left:50%;transform:translateX(-50%);z-index:999;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:${type==='ok'?'var(--teal)':'var(--amber)'};color:#fff`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2400);
}
function modal(html){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

render();
updateManualChips();
setTimeout(()=>fetchPrices(),500);
setInterval(()=>fetchPrices(),30*1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){
    const stale=!S.priceAt||Date.now()-new Date(S.priceAt).getTime()>60*1000;
    if(stale)fetchPrices();
  }
});
</script>
