<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="دارایی من">
<title>دارایی من</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg0:#fff;--bg1:#f5f5f3;--bg2:#ebebea;
--text1:#1a1a18;--text2:#555551;--text3:#888780;
--border:#e0dfd8;
--teal:#1D9E75;--teal-lt:#E1F5EE;--teal-dk:#085041;
--coral:#D85A30;--coral-lt:#FAECE7;--coral-dk:#4A1B0C;
--blue:#378ADD;--blue-lt:#E6F1FB;--blue-dk:#0C447C;
--amber:#BA7517;--amber-lt:#FAEEDA;--amber-dk:#633806;
--purple:#534AB7;--purple-lt:#EEEDFE;--purple-dk:#26215C;
--red:#E24B4A;--red-lt:#FCEBEB;--red-dk:#501313;
--green:#639922;--green-lt:#EAF3DE;--green-dk:#173404;
--r-md:8px;--r-lg:12px;--r-xl:16px;
}
@media(prefers-color-scheme:dark){:root{
--bg0:#1c1c1a;--bg1:#232320;--bg2:#2a2a27;
--text1:#f0efe8;--text2:#b4b2a9;--text3:#888780;
--border:#38382f;
--teal:#5DCAA5;--teal-lt:#04342C;--teal-dk:#9FE1CB;
--coral:#F0997B;--coral-lt:#4A1B0C;--coral-dk:#F5C4B3;
--blue:#85B7EB;--blue-lt:#042C53;--blue-dk:#B5D4F4;
--amber:#EF9F27;--amber-lt:#412402;--amber-dk:#FAC775;
--purple:#AFA9EC;--purple-lt:#26215C;--purple-dk:#CECBF6;
--red:#F09595;--red-lt:#501313;--red-dk:#F7C1C1;
--green:#97C459;--green-lt:#173404;--green-dk:#C0DD97;
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg1);color:var(--text1);font-size:15px;min-height:100vh;direction:rtl}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg0)}
.topbar{background:var(--bg0);border-bottom:0.5px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.topbar-title{font-size:17px;font-weight:500}
.topbar-sub{font-size:12px;color:var(--text3);margin-top:1px}
.content{flex:1;overflow-y:auto;padding-bottom:90px}
.navbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;background:var(--bg0);border-top:0.5px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:7px 2px;cursor:pointer;gap:2px}
.nav-label{font-size:9px;color:var(--text3)}
.nav-item.active .nav-label{color:var(--teal);font-weight:500}
.section{padding:16px}
.card{background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px}
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.metric{border-radius:var(--r-md);padding:12px;background:var(--bg1)}
.metric-label{font-size:11px;color:var(--text3);margin-bottom:4px}
.metric-value{font-size:18px;font-weight:500}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px}
.metric.teal{background:var(--teal-lt)}.metric.teal .metric-value{color:var(--teal-dk)}
.metric.coral{background:var(--coral-lt)}.metric.coral .metric-value{color:var(--coral)}
.metric.blue{background:var(--blue-lt)}.metric.blue .metric-value{color:var(--blue)}
.metric.purple{background:var(--purple-lt)}.metric.purple .metric-value{color:var(--purple)}
.metric.red{background:var(--red-lt)}.metric.red .metric-value{color:var(--red)}
.metric.green{background:var(--green-lt)}.metric.green .metric-value{color:var(--green)}
.hero{border-radius:var(--r-xl);padding:20px;margin-bottom:12px;text-align:center}
.hero.teal{background:var(--teal-lt);border:0.5px solid var(--teal)}
.hero.teal .hero-label{color:var(--teal-dk)}.hero.teal .hero-value{color:var(--teal-dk)}.hero.teal .hero-sub{color:var(--teal)}
.hero.purple{background:var(--purple-lt);border:0.5px solid var(--purple)}
.hero.purple .hero-label{color:var(--purple)}.hero.purple .hero-value{color:var(--purple)}.hero.purple .hero-sub{color:var(--purple)}
.hero-label{font-size:12px;margin-bottom:4px}
.hero-value{font-size:28px;font-weight:500}
.hero-sub{font-size:13px;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:var(--r-md);border:0.5px solid var(--border);background:var(--bg0);color:var(--text1);font-size:14px;cursor:pointer;font-family:inherit;width:100%;margin-bottom:8px}
.btn:active{opacity:.8;transform:scale(.98)}
.btn-primary{background:var(--teal);color:#fff;border-color:var(--teal)}
.btn-sm{padding:5px 12px;font-size:12px;width:auto;margin-bottom:0}
.btn-fab{position:fixed;bottom:calc(68px + env(safe-area-inset-bottom));right:16px;background:var(--teal);color:#fff;border:none;border-radius:50%;width:52px;height:52px;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(29,158,117,.35);z-index:99}
.btn-fab:active{transform:scale(.94)}
.ticker{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;border-bottom:0.5px solid var(--border);scrollbar-width:none;background:var(--bg0)}
.ticker::-webkit-scrollbar{display:none}
.ticker-chip{flex-shrink:0;background:var(--bg1);border:0.5px solid var(--border);border-radius:var(--r-md);padding:6px 10px;min-width:72px}
.ticker-name{font-size:9px;color:var(--text3);font-weight:500;margin-bottom:2px}
.ticker-price{font-size:12px;font-weight:500}
.ticker-chg{font-size:9px}
.up{color:var(--teal)}.dn{color:var(--coral)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pulse{animation:blink 1s infinite}
.row-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg0);border:0.5px solid var(--border);border-radius:var(--r-md);margin-bottom:8px;cursor:pointer}
.row-item:active{opacity:.8}
.item-icon{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.item-info{flex:1;min-width:0}
.item-title{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-sub{font-size:11px;color:var(--text3);margin-top:2px}
.item-right{text-align:left;flex-shrink:0}
.item-main{font-size:14px;font-weight:500}
.item-sec{font-size:11px;color:var(--text3)}
.positive{color:var(--teal)}.negative{color:var(--coral)}
.sec-title{font-size:12px;font-weight:500;color:var(--text3);margin-bottom:10px;letter-spacing:.3px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg0);border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 20px}
.modal-title{font-size:18px;font-weight:500;margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{font-size:12px;color:var(--text3);display:block;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text1);font-size:16px;font-family:inherit;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:2px solid var(--teal);outline-offset:-1px}
.seg{display:flex;background:var(--bg1);border-radius:var(--r-md);padding:3px;gap:2px;margin-bottom:14px}
.seg-opt{flex:1;padding:8px 4px;text-align:center;border-radius:calc(var(--r-md) - 2px);font-size:12px;cursor:pointer;color:var(--text2)}
.seg-opt.active{background:var(--bg0);color:var(--text1);font-weight:500;border:0.5px solid var(--border)}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar-label{font-size:11px;color:var(--text2);width:68px;text-align:right;flex-shrink:0}
.bar-track{flex:1;height:7px;background:var(--bg1);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px}
.bar-val{font-size:11px;color:var(--text2);width:56px;text-align:left;flex-shrink:0}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.pnl-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r-md);font-size:11px;font-weight:500}
.pnl-badge.profit{background:var(--green-lt);color:var(--green-dk)}
.pnl-badge.loss{background:var(--red-lt);color:var(--red-dk)}
.progress-track{height:5px;background:var(--bg1);border-radius:3px;overflow:hidden;margin-top:5px}
.progress-fill{height:100%;border-radius:3px;background:var(--teal)}
.cat-tag{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;background:var(--bg1);border:0.5px solid var(--border);margin:3px}
.cat-tag-del{cursor:pointer;color:var(--text3);font-size:14px}
.alert-banner{border-radius:var(--r-md);padding:10px 13px;margin-bottom:10px;font-size:12px;display:flex;align-items:center;gap:8px}
.alert-banner.warn{background:var(--amber-lt);border:0.5px solid var(--amber);color:var(--amber-dk)}
.alert-banner.danger{background:var(--red-lt);border:0.5px solid var(--red);color:var(--red-dk)}
.hint{background:var(--blue-lt);border:0.5px solid var(--blue);border-radius:var(--r-md);padding:12px;margin-bottom:12px;font-size:12px;color:var(--blue-dk);display:flex;align-items:flex-start;gap:8px;line-height:1.6}
.empty-state{text-align:center;padding:40px 24px;color:var(--text3)}
.day-label{font-size:11px;color:var(--text3);margin:12px 0 5px;font-weight:500}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc-bal-chip{display:inline-block;padding:2px 8px;border-radius:var(--r-md);font-size:11px;background:var(--teal-lt);color:var(--teal-dk)}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="page-title">داشبورد</div>
      <div class="topbar-sub" id="page-sub"></div>
    </div>
    <button onclick="showPage('settings')" style="padding:5px 10px;border:0.5px solid var(--border);border-radius:var(--r-md);background:var(--bg1);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit">⚙</button>
  </div>
  <div class="ticker" id="ticker">
    <div class="ticker-chip" id="chip-BTC"><div class="ticker-name">BTC</div><div class="ticker-price pulse" id="tp-BTC">...</div><div class="ticker-chg" id="tc-BTC">—</div></div>
    <div class="ticker-chip" id="chip-ETH"><div class="ticker-name">ETH</div><div class="ticker-price pulse" id="tp-ETH">...</div><div class="ticker-chg" id="tc-ETH">—</div></div>
    <div class="ticker-chip" id="chip-PAXG"><div class="ticker-name">PAXG</div><div class="ticker-price pulse" id="tp-PAXG">...</div><div class="ticker-chg" id="tc-PAXG">—</div></div>
    <div class="ticker-chip" onclick="editRate('usd')" style="cursor:pointer"><div class="ticker-name">USD ✎</div><div class="ticker-price" id="tp-USD">—</div><div class="ticker-chg" style="color:var(--amber)">دستی</div></div>
    <div class="ticker-chip" onclick="editRate('eur')" style="cursor:pointer"><div class="ticker-name">EUR ✎</div><div class="ticker-price" id="tp-EUR">—</div><div class="ticker-chg" style="color:var(--amber)">دستی</div></div>
  </div>
  <div class="content" id="content"></div>
  <button class="btn-fab" id="fab" onclick="fabAction()">+</button>
  <nav class="navbar">
    <div class="nav-item active" onclick="showPage('dashboard')" id="nav-dashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="13" y="3" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="3" y="13" width="8" height="8" rx="2" fill="var(--text3)"/><rect x="13" y="13" width="8" height="8" rx="2" fill="var(--text3)"/></svg>
      <div class="nav-label">داشبورد</div>
    </div>
    <div class="nav-item" onclick="showPage('transactions')" id="nav-transactions">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/><path d="M9 12h6M9 16h4" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="nav-label">تراکنش‌ها</div>
    </div>
    <div class="nav-item" onclick="showPage('accounts')" id="nav-accounts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="2" y="5" width="20" height="14" rx="3" stroke="var(--text3)" stroke-width="1.5"/><path d="M2 10h20" stroke="var(--text3)" stroke-width="1.5"/><circle cx="7" cy="15" r="1.5" fill="var(--text3)"/></svg>
      <div class="nav-label">حساب‌ها</div>
    </div>
    <div class="nav-item" onclick="showPage('investments')" id="nav-investments">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 17l4-4 4 4 4-6 4 2" stroke="var(--text3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="nav-label">سرمایه</div>
    </div>
    <div class="nav-item" onclick="showPage('debts')" id="nav-debts">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z" fill="var(--text3)"/></svg>
      <div class="nav-label">بدهی‌ها</div>
    </div>
    <div class="nav-item" onclick="showPage('settings')" id="nav-settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="var(--text3)" stroke-width="1.5"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="var(--text3)" stroke-width="1.5"/></svg>
      <div class="nav-label">تنظیمات</div>
    </div>
  </nav>
</div>
<div id="modal-container"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
// ── storage ─────────────────────────────────────────────────
function db(k,v){if(v===undefined){try{return JSON.parse(localStorage.getItem('pf5_'+k)||'null')}catch{return null}}try{localStorage.setItem('pf5_'+k,JSON.stringify(v))}catch{}}

const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const DEF_CATS={
  expense:['خوراک','حمل‌ونقل','مسکن','سلامت','پوشاک','تفریح','آموزش','قبوض','سایر'],
  income:['حقوق','فریلنس','سود سرمایه','هدیه','سایر'],
  investment:['بیت‌کوین','اتریوم','PAXG','طلا','سهام','صندوق','ملک','دلار','یورو','تتر','سایر'],
  debt:['وام بانکی','قسط خودرو','قسط مسکن','بدهی شخصی','کارت اعتباری','سایر'],
};
const ICONS={خوراک:'🍽',حمل‌ونقل:'🚗',مسکن:'🏠',سلامت:'💊',پوشاک:'👕',تفریح:'🎮',آموزش:'📚',قبوض:'💡',حقوق:'💼',فریلنس:'💻','سود سرمایه':'📈',هدیه:'🎁','بیت‌کوین':'₿',اتریوم:'⟠',PAXG:'🥇',طلا:'🥇',سهام:'📊',صندوق:'🏦',ملک:'🏗',دلار:'💵',یورو:'💶',تتر:'💲','وام بانکی':'🏦','قسط خودرو':'🚗','قسط مسکن':'🏠','بدهی شخصی':'🤝','کارت اعتباری':'💳',expense:'💸',income:'💰',investment:'📈',debt:'💰',default:'💳'};

// ── default data از بکاپ کاربر ──────────────────────────────
const BACKUP_ACCOUNTS=[
  {id:'a1',name:'کیف پول نقد',type:'cash',currency:'IRT',balance:50000000},
  {id:'a2',name:'بانک ملی',type:'bank',currency:'IRT',balance:200000000},
  {id:'a3',name:'حساب دلاری',type:'bank',currency:'USD',balance:500},
];
const BACKUP_INVESTMENTS=[
  {id:'i1776249858546',name:'طلای فیزیکی',type:'طلا',qty:25,buyPrice:6600000,currentPrice:17600000,currency:'IRT'},
  {id:'i1776250290442',name:'دلار نقدی',type:'دلار',qty:2760,buyPrice:140000,currentPrice:158000,currency:'IRT'},
  {id:'i1776250361353',name:'یورو نقدی',type:'یورو',qty:95,buyPrice:190000,currentPrice:180000,currency:'IRT'},
  {id:'i_paxg_merged',name:'PAXG',type:'PAXG',qty:2.7911,buyPrice:3530,currentPrice:4817.08,currency:'USD'},
  {id:'i1776261091237',name:'تتر در سرمایه با متین منتال',type:'تتر',qty:2900,buyPrice:152800,currentPrice:152800,currency:'IRT'},
  {id:'i1776261132007',name:'پول حساب ترکیه',type:'دلار',qty:2000,buyPrice:80000,currentPrice:152800,currency:'IRT'},
];
const BACKUP_DEBTS=[
  {id:'d1776249610791',name:'قسط وام صندوق',counterpart:'جان محمدی',category:'وام بانکی',total:700000000,remaining:658000000,installment:15000000,currency:'IRT',nextDate:'2026-04-21',note:'',direction:'owe'},
];

// ── state ────────────────────────────────────────────────────
let S={
  txs:         db('txs')         || [],
  accounts:    db('accounts')    || BACKUP_ACCOUNTS,
  investments: db('investments') || BACKUP_INVESTMENTS,
  debts:       db('debts')       || BACKUP_DEBTS,
  cats:        db('cats')        || {expense:[...DEF_CATS.expense],income:[...DEF_CATS.income],investment:[...DEF_CATS.investment],debt:[...DEF_CATS.debt]},
  usdIRT:  db('usdIRT')  || 152800,
  eurIRT:  db('eurIRT')  || 180000,
  prices:  db('prices')  || {BTC:73902.01,ETH:2321.51,PAXG:4817.08},
  priceAt: db('priceAt') || null,
  fetching:false,
  page:'dashboard',
  month:new Date().toISOString().slice(0,7),
  chart:null,
};
function save(){
  db('txs',S.txs);db('accounts',S.accounts);db('investments',S.investments);
  db('debts',S.debts);db('cats',S.cats);
  db('usdIRT',S.usdIRT);db('eurIRT',S.eurIRT);
  db('prices',S.prices);db('priceAt',S.priceAt);
}

// ── helpers ──────────────────────────────────────────────────
function toUSD(a,c){
  if(!a||isNaN(a))return 0;
  if(c==='USD'||c==='USDT')return a;
  if(c==='EUR')return a*(S.usdIRT/Math.max(S.eurIRT,1));
  if(c==='BTC')return a*Math.max(S.prices.BTC,1);
  if(c==='ETH')return a*Math.max(S.prices.ETH,1);
  if(c==='PAXG')return a*Math.max(S.prices.PAXG,1);
  return a/Math.max(S.usdIRT,1);
}
function toIRT(a,c){
  if(!a||isNaN(a))return 0;
  if(c==='IRT')return a;
  if(c==='EUR')return a*S.eurIRT;
  if(c==='BTC')return a*S.prices.BTC*S.usdIRT;
  if(c==='ETH')return a*S.prices.ETH*S.usdIRT;
  if(c==='PAXG')return a*S.prices.PAXG*S.usdIRT;
  return a*S.usdIRT;
}
function fmtT(n){return Math.round(n).toLocaleString('fa-IR')}
function fmtU(n){return '$'+parseFloat(n).toFixed(2)}
function fmtUS(n){if(n>=1000)return'$'+Math.round(n).toLocaleString('en-US');return'$'+parseFloat(n).toFixed(2)}
function today(){return new Date().toISOString().split('T')[0]}
function ago(iso){if(!iso)return'هرگز';const s=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(s<60)return'همین الان';if(s<3600)return Math.floor(s/60)+' دقیقه پیش';if(s<86400)return Math.floor(s/3600)+' ساعت پیش';return Math.floor(s/86400)+' روز پیش';}

// ── Binance ──────────────────────────────────────────────────
async function fetchPrices(){
  if(S.fetching)return;S.fetching=true;
  try{
    const url='https://api.binance.com/api/v3/ticker/24hr?symbols=["BTCUSDT","ETHUSDT","PAXGUSDT"]';
    const res=await Promise.race([fetch(url),new Promise((_,r)=>setTimeout(()=>r(new Error('t/o')),8000))]);
    if(!res.ok)throw new Error('HTTP '+res.status);
    const data=await res.json();
    const map={};data.forEach(d=>{map[d.symbol]={price:parseFloat(d.lastPrice),chg:parseFloat(d.priceChangePercent)}});
    if(map.BTCUSDT)S.prices.BTC=map.BTCUSDT.price;
    if(map.ETHUSDT)S.prices.ETH=map.ETHUSDT.price;
    if(map.PAXGUSDT)S.prices.PAXG=map.PAXGUSDT.price;
    S.priceAt=new Date().toISOString();
    save();updateTicker(map);
    if(['dashboard','investments'].includes(S.page))render();
  }catch(e){
    ['BTC','ETH','PAXG'].forEach(s=>{
      const p=document.getElementById('tp-'+s);
      if(p){p.classList.remove('pulse');if(S.prices[s]>0)p.textContent=fmtUS(S.prices[s]);}
    });
  }
  S.fetching=false;
}
function updateTicker(map){
  [['BTC','BTCUSDT'],['ETH','ETHUSDT'],['PAXG','PAXGUSDT']].forEach(([sym,key])=>{
    const d=map[key];if(!d)return;
    const p=document.getElementById('tp-'+sym);const c=document.getElementById('tc-'+sym);
    if(p){p.classList.remove('pulse');p.textContent=fmtUS(d.price);}
    if(c){c.textContent=(d.chg>=0?'+':'')+d.chg.toFixed(2)+'%';c.className='ticker-chg '+(d.chg>=0?'up':'dn');}
  });
  syncTicker();
}
function syncTicker(){
  const u=document.getElementById('tp-USD');const e=document.getElementById('tp-EUR');
  if(u)u.textContent=fmtT(S.usdIRT);if(e)e.textContent=fmtT(S.eurIRT);
}

// ── account balance (live, includes txs) ─────────────────────
function accBalance(id){
  const a=S.accounts.find(x=>x.id===id);
  if(!a)return{raw:0,usd:0,irt:0,cur:'IRT'};
  let bal=a.balance;
  S.txs.forEach(t=>{
    const isIRT=a.currency==='IRT';
    const conv=isIRT?toIRT(t.amount,t.currency):toUSD(t.amount,t.currency);
    if(t.toAccount===id)bal+=conv;
    if(t.fromAccount===id)bal-=conv;
  });
  return{raw:bal,usd:toUSD(bal,a.currency),irt:toIRT(bal,a.currency),cur:a.currency};
}

// ── investment P&L ───────────────────────────────────────────
function invPnL(i){
  const liveMap={'بیت‌کوین':'BTC','اتریوم':'ETH','PAXG':'PAXG'};
  const sym=liveMap[i.type]||liveMap[i.name];
  let curPriceUSD;
  if(sym&&S.prices[sym]>0){
    curPriceUSD=S.prices[sym];
  } else {
    curPriceUSD=toUSD(i.currentPrice||i.buyPrice,i.currency);
  }
  const buyUSD=toUSD(i.buyPrice,i.currency);
  const cost=i.qty*buyUSD;
  const now=i.qty*curPriceUSD;
  const pnl=now-cost;
  const pct=cost>0?pnl/cost*100:0;
  return{now,cost,pnl,pct,curPriceUSD,live:!!(sym&&S.prices[sym]>0)};
}

// ── calcs ────────────────────────────────────────────────────
function monthMetrics(m){
  let inc=0,exp=0;
  S.txs.filter(t=>t.date.startsWith(m)).forEach(t=>{
    const u=toUSD(t.amount,t.currency);
    if(t.type==='income')inc+=u;else if(t.type==='expense')exp+=u;
  });
  return{inc,exp,net:inc-exp,sav:inc>0?(inc-exp)/inc:0};
}
function netWorth(){
  let cash=0,inv=0,debt=0;
  S.accounts.forEach(a=>{const b=accBalance(a.id);cash+=b.usd;});
  S.investments.forEach(i=>{inv+=invPnL(i).now;});
  S.debts.filter(d=>d.direction==='owe').forEach(d=>{debt+=toUSD(d.remaining,d.currency);});
  return{cash,inv,debt,total:cash+inv-debt};
}

function payInst(id){
  const d=S.debts.find(x=>x.id===id);if(!d)return;
  const newRem=Math.max(0,d.remaining-d.installment);
  let newNext=d.nextDate;
  if(d.nextDate){const nd=new Date(d.nextDate);nd.setMonth(nd.getMonth()+1);newNext=nd.toISOString().split('T')[0];}
  d.remaining=newRem;d.nextDate=newNext;
  if(d.installment>0){
    S.txs.push({id:'tx'+Date.now(),date:today(),desc:'قسط: '+d.name,amount:d.installment,currency:d.currency,category:d.category,type:'expense',fromAccount:null,toAccount:null});
  }
  save();closeModal();render();toast('قسط ثبت شد ✓','ok');
}

function exportData(){
  const d={txs:S.txs,accounts:S.accounts,investments:S.investments,debts:S.debts,cats:S.cats,usdIRT:S.usdIRT,eurIRT:S.eurIRT,prices:S.prices,exported:new Date().toISOString()};
  const a=document.createElement('a');a.href='data:application/json,'+encodeURIComponent(JSON.stringify(d,null,2));
  a.download='finance-backup-'+today()+'.json';a.click();
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{
    const d=JSON.parse(ev.target.result);
    if(d.txs)S.txs=d.txs;if(d.accounts)S.accounts=d.accounts;
    if(d.investments)S.investments=d.investments;if(d.debts)S.debts=d.debts;
    if(d.cats)S.cats=d.cats;if(d.usdIRT)S.usdIRT=d.usdIRT;
    if(d.eurIRT)S.eurIRT=d.eurIRT;if(d.prices)S.prices=d.prices;
    save();render();toast('بکاپ بارگذاری شد ✓','ok');
  }catch{alert('فایل معتبر نیست')}};r.readAsText(f)};inp.click();
}
function clearTxs(){if(!confirm('همه تراکنش‌ها پاک شوند؟'))return;S.txs=[];save();render();toast('پاک شد','ok');}

function toast(msg,type='ok'){
  const old=document.getElementById('_t');if(old)old.remove();
  const t=document.createElement('div');t.id='_t';
  t.style.cssText=`position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:999;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;pointer-events:none;transition:opacity .3s;background:${type==='ok'?'var(--teal)':'var(--amber)'};color:#fff`;
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2400);
}
function modal(html){document.getElementById('modal-container').innerHTML=`<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){document.getElementById('modal-container').innerHTML='';}

// ── init ─────────────────────────────────────────────────────
render();syncTicker();
setTimeout(()=>fetchPrices(),500);
setInterval(()=>fetchPrices(),30*1000);
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){const stale=!S.priceAt||Date.now()-new Date(S.priceAt).getTime()>60*1000;if(stale)fetchPrices();}
});
</script>
